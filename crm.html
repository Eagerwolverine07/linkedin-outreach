<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    :root { --text: var(--ink); --muted: var(--ink-mid); --border: var(--rule-strong); }

    body { padding: 0; }
    .header, .stats, #view-container { max-width: 1120px; margin-left: auto; margin-right: auto; padding-left: 28px; padding-right: 28px; }
    #view-container { padding-left: 28px; padding-right: 28px; }
    .stats { padding: 0; margin: 0 auto 36px; max-width: 1064px; }
    #view-container { padding-bottom: 72px; }

    .nav-spacer { flex: 1; }
    .view-toggle { display: inline-flex; align-items: center; }

    /* ── company view ── */
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }
    .co-card { padding: 0; overflow: hidden; }
    .co-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
    }
    .co-card-head h3 { font-size: 15.5px; font-weight: 600; }
    .co-meta { margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); }
    .co-expand-btn {
      padding: 4px 8px;
      font-size: 13px;
      line-height: 1;
      flex-shrink: 0;
    }

    .funnel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--rule);
      background: var(--surface-2);
    }
    .funnel-step {
      padding: 12px 10px 13px;
      text-align: center;
      border-right: 1px solid var(--rule);
    }
    .funnel-step:last-child { border-right: 0; }
    .funnel-count {
      display: block;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 19px;
      font-weight: 500;
      line-height: 1;
      color: var(--ink);
    }
    .funnel-label {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.3;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    /* Only a warm intro is worth colouring; a zero never is. */
    .f-warm_intro { color: var(--signal); }
    .f-none, .is-nil { color: var(--ink-soft); font-weight: 400; }

    /* ── contact view ── */
    .contact-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 18px;
    }
    .filter-input { flex: 1; min-width: 220px; }
    .filter-select { width: auto; min-width: 155px; }
    .contact-toolbar .csv-btn { margin-left: auto; }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
      overflow: auto;
    }
    .table-wrap td { vertical-align: top; }

    .name-cell { min-width: 150px; }
    .name-cell a { font-weight: 500; }
    .co { margin-top: 2px; font-size: 12px; color: var(--ink-soft); }

    .pri-badge { font-family: var(--sans); }
    .pri-high   { background: var(--stall-tint);  border-color: #E0D2A6;            color: var(--stall); font-weight: 600; }
    .pri-medium { background: var(--surface);     border-color: var(--rule-strong); color: var(--ink-mid); }
    .pri-low    { background: var(--closed-tint); border-color: var(--rule-strong); color: var(--closed); }

    /* ── status pill + dropdown ── */
    .status-wrap { position: relative; }
    .status-pill { cursor: pointer; user-select: none; }
    .status-pill:hover { border-color: var(--ink-mid); }

    .pill-sent       { background: var(--surface);     border-color: var(--rule-strong); color: var(--ink-mid); }
    .pill-accepted   { background: #EFF4F1;            border-color: #C9DCD1;            color: #3F7458; }
    .pill-replied    { background: var(--signal-tint); border-color: var(--signal-rule); color: #2C7555; }
    .pill-warm_intro { background: var(--signal);      border-color: var(--signal);      color: #FFFFFF; }

    .status-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      z-index: 30;
      min-width: 168px;
      padding: 5px;
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px rgba(21,32,46,.10);
    }
    .status-dropdown.open { display: block; }
    .status-option {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }
    .status-option:hover { background: var(--surface-2); }
    .status-option.selected { font-weight: 600; }
    .opt-check { margin-left: auto; color: var(--signal); opacity: 0; }
    .status-option.selected .opt-check { opacity: 1; }

    /* ── message + notes ── */
    .msg-preview, .msg-full {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-mid);
      cursor: pointer;
      min-width: 210px;
    }
    .msg-full { display: none; }
    .msg-expanded .msg-preview { display: none; }
    .msg-expanded .msg-full { display: block; color: var(--ink); }

    .notes-cell { min-width: 140px; }
    .notes-view {
      min-height: 22px;
      padding: 4px 6px;
      margin: -4px -6px;
      font-size: 13px;
      color: var(--ink-mid);
      border-radius: 4px;
      cursor: text;
    }
    .notes-view:hover { background: var(--surface-2); outline: 1px dashed var(--rule-strong); }
    .notes-view:empty::before { content: 'Add a note'; color: var(--ink-soft); opacity: .65; }
    .notes-input { display: none; min-height: 62px; font-size: 13px; resize: vertical; }
    .notes-cell.editing .notes-view { display: none; }
    .notes-cell.editing .notes-input { display: block; }

    .date-input {
      width: auto;
      min-width: 132px;
      padding: 6px 9px;
      font-family: var(--mono);
      font-size: 12.5px;
    }
    .date-input.overdue { border-color: #C9A77A; background: var(--stall-tint); color: var(--stall); }

    /* ── loading, empty ── */
    .loader { display: flex; align-items: center; justify-content: center; gap: 11px; }
    .spinner {
      width: 15px; height: 15px;
      padding: 0;
      border: 2px solid var(--rule);
      border-top-color: var(--ink-mid);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    .empty h3 { font-size: 16px; margin-bottom: 6px; }
    .empty p { font-size: 14px; color: var(--ink-mid); }

    /* ── toast ── */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 14px);
      z-index: 90;
      padding: 10px 18px;
      font-size: 13.5px;
      color: var(--paper);
      background: var(--ink);
      border-radius: var(--radius);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 720px) {
      .header, .stats, #view-container { padding-left: 18px; padding-right: 18px; }
      .stats { margin-left: 18px; margin-right: 18px; }
      .company-grid { grid-template-columns: 1fr; }
      .contact-toolbar .csv-btn { margin-left: 0; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-capsule">
    <a href="/" class="nav-pill">Home</a>
    <a href="/tracker" class="nav-pill">Applications</a>
    <a href="/outreach" class="nav-pill">Outreach</a>
    <a href="/dashboard" class="nav-pill">Dashboard</a>
    <a href="/crm" class="nav-pill active">Contacts</a>
    <span class="nav-spacer"></span>
    <span class="view-toggle">
      <button class="nav-btn active" id="btn-company" onclick="switchView('company')">By company</button>
      <button class="nav-btn" id="btn-contact" onclick="switchView('contact')">By person</button>
    </span>
  </div>
</nav>

<div class="header">
  <h1>Contacts</h1>
  <p>Everyone you have reached out to, and how far each conversation got.</p>
</div>

<div class="stats" id="stats">
  <div class="stat-card"><div class="value" id="s-total">—</div><div class="label">Contacted</div></div>
  <div class="stat-card"><div class="value" id="s-accepted">—</div><div class="label">Accepted</div></div>
  <div class="stat-card"><div class="value" id="s-replied">—</div><div class="label">Replied</div></div>
  <div class="stat-card is-signal"><div class="value f-warm_intro" id="s-warm_intro">—</div><div class="label">Warm intros</div><div class="kpi-sub" id="s-warm_rate"></div></div>
  <div class="stat-card is-quiet"><div class="value f-none" id="s-no_response">—</div><div class="label">No response</div></div>
</div>

<div id="view-container">
  <div id="loader" class="loader"><div class="spinner"></div>Loading contacts…</div>
</div>

<div id="toast"></div>


<script>
  let ALL_CONTACTS  = [];
  let CURRENT_VIEW  = 'company';
  let _search = '', _filterStatus = '', _filterCompany = '', _filterPriority = '';

  const FLAGS = ['accepted','replied','warm_intro'];
  const FLAG_LABELS = { accepted:'Accepted', replied:'Replied', warm_intro:'Warm Intro' };

  // Status hierarchy: highest flag wins; "sent" is baseline
  const STATUS_ORDER = ['warm_intro','replied','accepted'];
  function topStatus(c) {
    for (const f of STATUS_ORDER) { if (c[f]) return f; }
    return 'sent';
  }

  document.addEventListener('DOMContentLoaded', loadContacts);

  async function loadContacts() {
    try {
      const res  = await fetch('/contacts?limit=5000');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      ALL_CONTACTS = Array.isArray(data) ? data : [];
      renderStats();
      renderView();
    } catch (e) {
      document.getElementById('view-container').innerHTML =
        `<div class="empty"><h3>Could not load contacts</h3><p>${e.message}</p></div>`;
    }
  }

  function renderStats() {
    const c = ALL_CONTACTS;
    document.getElementById('s-total').textContent      = c.length;
    document.getElementById('s-accepted').textContent   = c.filter(x => x.accepted).length;
    document.getElementById('s-replied').textContent    = c.filter(x => x.replied).length;
    const warmCount = c.filter(x => x.warm_intro).length;
    const repliedCount = c.filter(x => x.replied).length;
    const warmPct = repliedCount > 0 ? Math.round((warmCount / repliedCount) * 100) : 0;
    document.getElementById('s-warm_intro').textContent = warmCount;
    const wr = document.getElementById('s-warm_rate');
    if (wr) wr.textContent = repliedCount > 0 ? `${warmPct}% of replies` : 'no replies yet';
    document.getElementById('s-no_response').textContent = c.filter(x => !x.accepted && !x.replied && !x.warm_intro).length;
  }

  function switchView(v) {
    CURRENT_VIEW = v;
    document.getElementById('btn-company').classList.toggle('active', v==='company');
    document.getElementById('btn-contact').classList.toggle('active', v==='contact');
    renderView();
  }

  function renderView() {
    CURRENT_VIEW === 'company' ? renderCompanyView() : renderContactView();
  }

  /* ── BY COMPANY ── */
  function renderCompanyView() {
    const vc = document.getElementById('view-container');
    if (!ALL_CONTACTS.length) {
      vc.innerHTML = `<div class="empty"><h3>No contacts yet</h3><p>Run the pipeline to generate outreach messages.</p></div>`;
      return;
    }
    const groups = {};
    for (const c of ALL_CONTACTS) {
      const key = c.company || 'Unknown';
      (groups[key] = groups[key] || []).push(c);
    }
    const sorted = Object.entries(groups).sort((a,b) => {
      const la = Math.max(...a[1].map(x => +new Date(x.created_at)));
      const lb = Math.max(...b[1].map(x => +new Date(x.created_at)));
      return lb - la;
    });
    const cards = sorted.map(([company, contacts]) => {
      const counts = {};
      FLAGS.forEach(f => counts[f] = contacts.filter(c => c[f]).length);
      counts.no_response = contacts.filter(c => !c.accepted && !c.replied && !c.warm_intro).length;
      const date = new Date(Math.max(...contacts.map(c => +new Date(c.created_at))));
      const ds = date.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      const flagSteps = [...FLAGS, 'no_response'];
      const flagLabels = { accepted:'Accepted', replied:'Replied', warm_intro:'Warm intro', no_response:'No response' };
      const flagClasses = { accepted:'', replied:'', warm_intro:'f-warm_intro', no_response:'f-none' };
      const steps = flagSteps.map(s => `
        <div class="funnel-step">
          <span class="funnel-count ${counts[s] ? flagClasses[s] : 'is-nil'}">${counts[s]}</span>
          <span class="funnel-label">${flagLabels[s]}</span>
        </div>`).join('');
      return `
        <div class="co-card">
          <div class="co-card-head">
            <div class="co-card-head-text">
              <h3>${esc(company)}</h3>
              <div class="co-meta">${contacts.length} contact${contacts.length!==1?'s':''}, last run ${ds}</div>
            </div>
            <button class="co-expand-btn" data-company="${esc(company)}" onclick="drillToContacts(this.dataset.company)">View</button>
          </div>
          <div class="funnel">${steps}</div>
        </div>`;
    }).join('');
    vc.innerHTML = `<div class="company-grid">${cards}</div>`;
  }

  /* ── BY CONTACT ── */
  function renderContactView() {
    const vc = document.getElementById('view-container');
    if (!ALL_CONTACTS.length) {
      vc.innerHTML = `<div class="empty"><h3>No contacts yet</h3><p>Generate some messages on the Outreach page and they will show up here.</p></div>`;
      return;
    }
    const companies = [...new Set(ALL_CONTACTS.map(c => c.company).filter(Boolean))].sort();
    const coOpts = companies.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

    vc.innerHTML = `
      <div class="contact-toolbar">
        <input class="filter-input" id="f-search" type="text" placeholder="Search name or company…" oninput="applyFilters()">
        <select class="filter-select" id="f-company" onchange="applyFilters()"><option value="">All companies</option>${coOpts}</select>
        <select class="filter-select" id="f-flag" onchange="applyFilters()">
          <option value="">All contacts</option>
          <option value="accepted">Accepted</option>
          <option value="replied">Replied</option>
          <option value="warm_intro">Warm intro</option>
          <option value="no_response">No response</option>
        </select>
        <select class="filter-select" id="f-priority" onchange="applyFilters()">
          <option value="">All priorities</option>
          <option value="high">🔴 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">⚪ Low</option>
        </select>
        <button class="csv-btn" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Contact</th><th>Priority</th><th>Status</th><th>Message</th><th>Notes</th><th>Follow-up</th><th>Added</th><th></th>
          </tr></thead>
          <tbody id="contact-tbody"></tbody>
        </table>
      </div>`;

    document.getElementById('f-search').value    = _search;
    document.getElementById('f-company').value  = _filterCompany;
    document.getElementById('f-flag').value      = _filterStatus;
    document.getElementById('f-priority').value  = _filterPriority;
    applyFilters();
  }

  function applyFilters() {
    _search          = (document.getElementById('f-search')?.value    || '').toLowerCase();
    _filterCompany   =  document.getElementById('f-company')?.value   || '';
    _filterStatus    =  document.getElementById('f-flag')?.value      || '';
    _filterPriority  =  document.getElementById('f-priority')?.value  || '';

    const today = new Date(); today.setHours(0,0,0,0);
    const filtered = ALL_CONTACTS.filter(c => {
      if (_filterStatus) {
        if (_filterStatus === 'no_response' && (c.accepted || c.replied || c.warm_intro)) return false;
        if (_filterStatus !== 'no_response' && !c[_filterStatus]) return false;
      }
      if (_filterPriority && (c.priority || 'medium') !== _filterPriority) return false;
      if (_filterCompany && c.company !== _filterCompany) return false;
      if (_search && !`${c.name} ${c.company}`.toLowerCase().includes(_search)) return false;
      return true;
    });

    const tbody = document.getElementById('contact-tbody');
    if (!tbody) return;
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No contacts match these filters.</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map((c, i) => {
      const added    = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const preview  = (c.message||'').substring(0,80)+((c.message||'').length>80?'…':'');
      const overdue  = c.follow_up_date && new Date(c.follow_up_date) < today;
      const status = topStatus(c);
      const statusLabel = status === 'sent' ? 'Sent' : FLAG_LABELS[status];
      const opts = [
        { key:'sent',       label:'Sent',       dot:'#C8CCD2' },
        { key:'accepted',   label:'Accepted',   dot:'#8CB2A0' },
        { key:'replied',    label:'Replied',    dot:'#4D8A6C' },
        { key:'warm_intro', label:'Warm intro', dot:'#1C6B4A' },
      ];
      const optHtml = opts.map(o => `
        <div class="status-option opt-${o.key}${status===o.key?' selected':''}"
          ${o.key==='sent' ? '' : `onclick="setStatus(${c.id},'${o.key}',event)"`}>
          <div class="opt-dot" style="background:${o.dot}"></div>
          ${o.label}
          <span class="opt-check">✓</span>
        </div>`).join('');
      const pri = c.priority || 'medium';
      const priLabel = pri.charAt(0).toUpperCase() + pri.slice(1);
      return `
        <tr id="row-${c.id}">
          <td style="color:var(--muted);font-size:12px">${i+1}</td>
          <td class="name-cell">
            ${c.url ? `<a href="${esc(c.url)}" target="_blank">${esc(c.name||c.url)}</a>` : esc(c.name||'—')}
            <div class="co">${esc(c.company||'')}</div>
          </td>
          <td><span class="pri-badge pri-${pri}"><i class="pill-dot"></i>${priLabel}</span></td>
          <td>
            <div class="status-wrap" id="sw-${c.id}">
              <div class="status-pill pill-${status}" onclick="toggleStatusDropdown(${c.id},event)">
                <div class="pill-dot"></div>${statusLabel}
              </div>
              <div class="status-dropdown" id="sd-${c.id}">${optHtml}</div>
            </div>
          </td>
          <td>
            <div class="msg-preview" onclick="toggleMsg(this)">${esc(preview)}</div>
            <div class="msg-full" onclick="toggleMsg(this)">${esc(c.message||'')}</div>
          </td>
          <td class="notes-cell">
            <div class="notes-view" onclick="startEditNotes(${c.id})" id="nv-${c.id}">${esc(c.notes||'')}</div>
            <textarea class="notes-input" id="ni-${c.id}"
              onblur="saveNotes(${c.id})"
              onkeydown="if(event.key==='Escape')cancelNotes(${c.id})"
            >${esc(c.notes||'')}</textarea>
          </td>
          <td>
            <input type="date" class="date-input${overdue?' overdue':''}" id="dt-${c.id}"
              value="${c.follow_up_date||''}" onchange="updateDate(${c.id},this.value)">
          </td>
          <td style="color:var(--muted);font-size:12px;white-space:nowrap">${added}</td>
          <td style="text-align:center">
            <button class="btn-trash" title="Delete contact" onclick="trashContact(${c.id}, event)">&times;</button>
          </td>
        </tr>`;
    }).join('');
  }

  function toggleMsg(el) {
    // el is either .msg-preview or .msg-full — both are direct children of the td
    el.parentElement.classList.toggle('msg-expanded');
  }

  function startEditNotes(id) {
    document.getElementById(`nv-${id}`).style.display = 'none';
    const inp = document.getElementById(`ni-${id}`);
    inp.style.display = 'block';
    inp.focus();
  }
  function cancelNotes(id) {
    const c = ALL_CONTACTS.find(x => x.id===id);
    document.getElementById(`ni-${id}`).value = c?.notes||'';
    document.getElementById(`ni-${id}`).style.display = 'none';
    document.getElementById(`nv-${id}`).style.display = '';
  }
  async function saveNotes(id) {
    const inp = document.getElementById(`ni-${id}`);
    const val = inp.value.trim();
    const c   = ALL_CONTACTS.find(x => x.id===id);
    if (!c || val === (c.notes||'')) { cancelNotes(id); return; }
    await patchContact(id, {notes: val});
    c.notes = val;
    const nv = document.getElementById(`nv-${id}`);
    nv.textContent = val;
    inp.style.display = 'none';
    nv.style.display  = '';
    renderStats();
  }

  function toggleStatusDropdown(id, e) {
    e.stopPropagation();
    const sd = document.getElementById(`sd-${id}`);
    const isOpen = sd.classList.contains('open');
    document.querySelectorAll('.status-dropdown.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) sd.classList.add('open');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.status-dropdown.open').forEach(el => el.classList.remove('open'));
  });

  async function setStatus(id, newStatus, e) {
    e.stopPropagation();
    const c = ALL_CONTACTS.find(x => x.id===id);
    if (!c) return;

    // clicking the already-selected status resets to "sent"
    const current = topStatus(c);
    const target = current === newStatus ? null : newStatus;

    // build patch: clear all flags, then set the right ones
    const patch = { accepted: false, replied: false, warm_intro: false };
    if (target === 'accepted')   patch.accepted = true;
    if (target === 'replied')    { patch.accepted = true; patch.replied = true; }
    if (target === 'warm_intro') { patch.accepted = true; patch.replied = true; patch.warm_intro = true; }

    await patchContact(id, patch);
    Object.assign(c, patch);

    // re-render just this cell
    const sw = document.getElementById(`sw-${id}`);
    if (sw) {
      const status = topStatus(c);
      const statusLabel = status === 'sent' ? 'Sent' : FLAG_LABELS[status];
      const opts = [
        { key:'sent',       label:'Sent',       dot:'#C8CCD2' },
        { key:'accepted',   label:'Accepted',   dot:'#8CB2A0' },
        { key:'replied',    label:'Replied',    dot:'#4D8A6C' },
        { key:'warm_intro', label:'Warm intro', dot:'#1C6B4A' },
      ];
      const optHtml = opts.map(o => `
        <div class="status-option opt-${o.key}${status===o.key?' selected':''}"
          ${o.key==='sent' ? '' : `onclick="setStatus(${id},'${o.key}',event)"`}>
          <div class="opt-dot" style="background:${o.dot}"></div>
          ${o.label}
          <span class="opt-check">✓</span>
        </div>`).join('');
      sw.innerHTML = `
        <div class="status-pill pill-${status}" onclick="toggleStatusDropdown(${id},event)">
          <div class="pill-dot"></div>${statusLabel}
        </div>
        <div class="status-dropdown" id="sd-${id}">${optHtml}</div>`;
    }
    renderStats();
  }

  async function updateDate(id, date) {
    const c = ALL_CONTACTS.find(x => x.id===id);
    if (!c) return;
    await patchContact(id, {follow_up_date: date||null});
    c.follow_up_date = date||null;
    const today = new Date(); today.setHours(0,0,0,0);
    const el = document.getElementById(`dt-${id}`);
    if (el) el.classList.toggle('overdue', !!date && new Date(date) < today);
  }

  async function trashContact(id, e) {
    e.stopPropagation();
    await patchContact(id, {deleted: true});
    // Remove from local array and re-render
    ALL_CONTACTS = ALL_CONTACTS.filter(c => c.id !== id);
    renderStats();
    applyFilters();
  }

  async function patchContact(id, fields) {
    try {
      const res  = await fetch(`/contacts/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(fields),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      showToast('Saved ✓');
    } catch(e) {
      showToast('Save failed: ' + e.message, true);
    }
  }

  function exportCSV() {
    const cols = ['id','name','company','accepted','replied','warm_intro','notes','follow_up_date','url','message','created_at'];
    const rows = [cols.join(',')];
    for (const c of ALL_CONTACTS) {
      rows.push(cols.map(k => `"${(c[k]??'').toString().replace(/"/g,'""')}"`).join(','));
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.join('\n')], {type:'text/csv'}));
    a.download = `outreach-crm-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  let _tt;
  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = isError ? '#ff6b6b' : 'rgba(123,110,246,.5)';
    t.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Company arrow → switch to By Contact with filter pre-set ── */
  function drillToContacts(company) {
    _filterCompany = company;
    switchView('contact');
  }
</script>
</body>
</html>
