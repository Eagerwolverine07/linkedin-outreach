<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── tokens ── */
    :root {
      --grad:   linear-gradient(135deg, #ffb347 0%, #c471ed 55%, #7b6ef6 100%);
      --bg:     #fdf0c8;
      --surface: rgba(255,248,220,0.65);
      --card:   rgba(255,255,255,0.52);
      --border: rgba(255,255,255,0.6);
      --text:   #1a1035;
      --muted:  #9090aa;
      --radius: 16px;
      --font:   'Plus Jakarta Sans', sans-serif;
      --glass-shadow: 0 8px 32px rgba(120,80,40,0.10), 0 1.5px 0 rgba(255,255,255,0.7) inset;
      --glass-blur: blur(18px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: #f5e6d8;
      background-image:
        radial-gradient(ellipse 70% 55% at 100% 0%, #f0b488 0%, transparent 50%),
        radial-gradient(ellipse 55% 50% at 100% 100%, #c94f72 0%, transparent 50%),
        radial-gradient(ellipse 50% 45% at 0% 100%,  #7744aa 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    .grad-text {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── nav ── */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 10;
      pointer-events: none;
    }
    .nav-capsule {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: rgba(253,240,224,0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 4px 24px rgba(120,80,20,0.12), 0 1px 0 rgba(255,255,255,0.7) inset;
    }
    .nav-btn, .nav-pill {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      transition: all .2s;
      white-space: nowrap;
      cursor: pointer;
      font-family: var(--font);
    }
    .nav-btn:hover, .nav-pill:hover { color: var(--text); background: rgba(255,255,255,0.5); }
    .nav-btn.active, .nav-pill.active {
      background: transparent;
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      border: 1.5px solid transparent;
      background-image: linear-gradient(rgba(253,240,224,0.0), rgba(253,240,224,0.0)),
                        var(--grad);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 1px 6px rgba(196,113,237,0.18);
    }
    .nav-divider {
      width: 1px; height: 18px;
      background: rgba(150,120,60,0.2);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* ── header ── */
    .header {
      padding: 36px 32px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }
    .header h1 { font-size: 28px; font-weight: 700; }
    .header p  { color: var(--muted); margin-top: 6px; font-size: 13px; }

    /* ── stats strip ── */
    .stats {
      display: flex;
      gap: 16px;
      padding: 20px 32px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      min-width: 130px;
      flex: 1;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
    }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }

    /* ── view container ── */
    #view-container { padding: 0 32px 48px; }

    /* ── flag colours (stat cards + funnel) ── */
    .f-accepted  { color: #7b6ef6; }
    .f-replied   { color: #c471ed; }
    .f-warm_intro { color: #ffb347; }
    .f-none      { color: #b0adc0; }

    /* ── priority badge ── */
    .pri-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      white-space: nowrap; border: 1px solid;
    }
    .pri-high   { color: #e85d04; border-color: rgba(232,93,4,0.3);   background: rgba(232,93,4,0.08); }
    .pri-medium { color: #7b6ef6; border-color: rgba(123,110,246,0.3); background: rgba(123,110,246,0.08); }
    .pri-low    { color: #9090aa; border-color: rgba(144,144,170,0.3); background: rgba(144,144,170,0.08); }

    /* ── trash button ── */
    .btn-trash {
      background: transparent;
      border: 1.5px solid rgba(239,68,68,0.22);
      border-radius: 7px;
      color: rgba(239,68,68,0.45);
      font-size: 14px;
      padding: 4px 7px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      line-height: 1;
    }
    .btn-trash:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.06); }

    /* ── status pill (cell trigger) ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1.5px solid;
      transition: opacity .15s;
      user-select: none;
    }
    .status-pill:hover { opacity: 0.8; }
    .status-pill .pill-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    /* per-status pill colors */
    .pill-sent      { color: #9090aa; border-color: rgba(144,144,170,0.35); background: rgba(144,144,170,0.08); }
    .pill-sent      .pill-dot { background: #b0adc0; }
    .pill-accepted  { color: #7b6ef6; border-color: rgba(123,110,246,0.35); background: rgba(123,110,246,0.08); }
    .pill-accepted  .pill-dot { background: #7b6ef6; }
    .pill-replied   { color: #c471ed; border-color: rgba(196,113,237,0.35); background: rgba(196,113,237,0.08); }
    .pill-replied   .pill-dot { background: #c471ed; }
    .pill-warm_intro { color: #d08800; border-color: rgba(255,179,71,0.4); background: rgba(255,179,71,0.1); }
    .pill-warm_intro .pill-dot { background: #ffb347; }

    /* ── status dropdown ── */
    .status-wrap { position: relative; width: fit-content; }
    .status-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 100;
      background: rgba(253,240,224,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 8px 28px rgba(120,80,40,0.18);
      min-width: 152px;
      flex-direction: column;
      gap: 2px;
    }
    .status-dropdown.open { display: flex; }
    .status-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s;
    }
    .status-option:hover { background: rgba(255,255,255,0.55); }
    .status-option.selected { background: rgba(255,255,255,0.42); }
    .status-option .opt-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-option.opt-sent    { color: #9090aa; }
    .status-option.opt-sent    .opt-dot { background: #b0adc0; }
    .status-option.opt-accepted  { color: #7b6ef6; }
    .status-option.opt-accepted  .opt-dot { background: #7b6ef6; }
    .status-option.opt-replied   { color: #c471ed; }
    .status-option.opt-replied   .opt-dot { background: #c471ed; }
    .status-option.opt-warm_intro { color: #d08800; }
    .status-option.opt-warm_intro .opt-dot { background: #ffb347; }
    /* sent is always checked, never clickable */
    .status-option.opt-sent { cursor: default; opacity: 0.6; }
    .status-option .opt-check {
      margin-left: auto;
      font-size: 11px;
      opacity: 0;
    }
    .status-option.selected .opt-check { opacity: 1; }

    /* ─── BY COMPANY view ─── */
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding-top: 24px;
    }
    .co-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
    }
    .co-card-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .co-card-head-text { flex: 1; }
    .co-card-head h3 { font-size: 15px; font-weight: 700; }
    .co-card-head .co-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .co-expand-btn {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all .2s;
      text-decoration: none;
    }
    .co-expand-btn:hover {
      color: #7b6ef6;
      transform: scale(1.2);
    }

    .funnel {
      display: flex;
      padding: 14px 20px 16px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .funnel-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 56px;
    }
    .funnel-count  { font-size: 22px; font-weight: 700; }
    .funnel-label  { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align:center; }


    /* ─── BY CONTACT view ─── */
    .contact-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 20px;
      padding-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-select, .filter-input {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 12px;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color .2s;
    }
    .filter-select:focus, .filter-input:focus { border-color: #7b6ef6; }
    .filter-input { min-width: 220px; }

    .csv-btn {
      margin-left: auto;
      padding: 7px 16px;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, color .18s;
    }
    .csv-btn:hover {
      background: rgba(255,255,255,0.58);
      color: var(--text);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.45);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-shadow);
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: rgba(255,240,180,0.45);
      padding: 12px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,0.5);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.4); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.6); }
    td { padding: 11px 14px; vertical-align: top; }

    td.name-cell a { color: var(--text); text-decoration: none; font-weight: 600; }
    td.name-cell a:hover { text-decoration: underline; }
    td.name-cell .co { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .status-select {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.6);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    .status-select:focus { border-color: #7b6ef6; }

    .msg-preview {
      color: var(--muted);
      font-size: 12px;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .msg-preview:hover { color: var(--text); }
    .msg-full {
      display: none;
      font-size: 12px;
      color: var(--text);
      max-width: 340px;
      white-space: pre-wrap;
      line-height: 1.5;
      cursor: pointer;
    }
    .msg-expanded .msg-preview { display: none; }
    .msg-expanded .msg-full    { display: block; }

    .notes-cell { min-width: 160px; }
    .notes-view {
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      min-height: 18px;
    }
    .notes-view:empty::before { content: '+ add note'; opacity: .4; }
    .notes-view:hover { color: var(--text); }
    .notes-input {
      display: none;
      width: 100%;
      background: var(--surface);
      border: 1px solid #7b6ef6;
      color: var(--text);
      border-radius: 6px;
      padding: 5px 8px;
      font-family: var(--font);
      font-size: 12px;
      resize: vertical;
      min-height: 60px;
      outline: none;
    }

    .date-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      width: 130px;
      cursor: pointer;
    }
    .date-input:focus { border-color: #7b6ef6; }
    .date-input::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.4); }
    .overdue { color: #ff6b6b !important; border-color: rgba(255,107,107,.3) !important; }

    /* toast */
    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all .25s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* empty / loader */
    .empty { text-align: center; padding: 64px 32px; color: var(--muted); }
    .empty h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .loader { display: flex; align-items: center; gap: 10px; padding: 48px 0; justify-content: center; color: var(--muted); }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: #7b6ef6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-capsule">
    <a href="/" class="nav-pill">Home</a>
    <div class="nav-divider"></div>
    <a href="/outreach" class="nav-pill">Pipeline</a>
    <a href="/dashboard" class="nav-pill">Dashboard</a>
    <a href="/crm" class="nav-pill active">CRM</a>
  </div>
  <div class="nav-capsule">
    <button class="nav-btn active" id="btn-company" onclick="switchView('company')">By Company</button>
    <button class="nav-btn" id="btn-contact" onclick="switchView('contact')">By Contact</button>
  </div>
</nav>

<div class="header">
  <h1>Contact Tracker</h1>
  <p>Track every outreach conversation from sent → warm intro.</p>
</div>

<div class="stats" id="stats">
  <div class="stat-card"><div class="label">Total Contacts</div><div class="value grad-text" id="s-total">—</div></div>
  <div class="stat-card"><div class="label">Accepted</div><div class="value f-accepted" id="s-accepted">—</div></div>
  <div class="stat-card"><div class="label">Replied</div><div class="value f-replied" id="s-replied">—</div></div>
  <div class="stat-card"><div class="label">Warm Intro</div><div class="value f-warm_intro" id="s-warm_intro">—</div></div>
  <div class="stat-card"><div class="label">No Response</div><div class="value f-none" id="s-no_response">—</div></div>
</div>

<div id="view-container">
  <div id="loader" class="loader"><div class="spinner"></div>Loading contacts…</div>
</div>

<div id="toast"></div>


<script>
  let ALL_CONTACTS  = [];
  let CURRENT_VIEW  = 'company';
  let _search = '', _filterStatus = '', _filterCompany = '', _filterPriority = '';

  const FLAGS = ['accepted','replied','warm_intro'];
  const FLAG_LABELS = { accepted:'Accepted', replied:'Replied', warm_intro:'Warm Intro' };

  // Status hierarchy: highest flag wins; "sent" is baseline
  const STATUS_ORDER = ['warm_intro','replied','accepted'];
  function topStatus(c) {
    for (const f of STATUS_ORDER) { if (c[f]) return f; }
    return 'sent';
  }

  document.addEventListener('DOMContentLoaded', loadContacts);

  async function loadContacts() {
    try {
      const res  = await fetch('/contacts?limit=500');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      ALL_CONTACTS = Array.isArray(data) ? data : [];
      renderStats();
      renderView();
    } catch (e) {
      document.getElementById('view-container').innerHTML =
        `<div class="empty"><h3>Could not load contacts</h3><p>${e.message}</p></div>`;
    }
  }

  function renderStats() {
    const c = ALL_CONTACTS;
    document.getElementById('s-total').textContent      = c.length;
    document.getElementById('s-accepted').textContent   = c.filter(x => x.accepted).length;
    document.getElementById('s-replied').textContent    = c.filter(x => x.replied).length;
    document.getElementById('s-warm_intro').textContent = c.filter(x => x.warm_intro).length;
    document.getElementById('s-no_response').textContent = c.filter(x => !x.accepted && !x.replied && !x.warm_intro).length;
  }

  function switchView(v) {
    CURRENT_VIEW = v;
    document.getElementById('btn-company').classList.toggle('active', v==='company');
    document.getElementById('btn-contact').classList.toggle('active', v==='contact');
    renderView();
  }

  function renderView() {
    CURRENT_VIEW === 'company' ? renderCompanyView() : renderContactView();
  }

  /* ── BY COMPANY ── */
  function renderCompanyView() {
    const vc = document.getElementById('view-container');
    if (!ALL_CONTACTS.length) {
      vc.innerHTML = `<div class="empty"><h3>No contacts yet</h3><p>Run the pipeline to generate outreach messages.</p></div>`;
      return;
    }
    const groups = {};
    for (const c of ALL_CONTACTS) {
      const key = c.company || 'Unknown';
      (groups[key] = groups[key] || []).push(c);
    }
    const sorted = Object.entries(groups).sort((a,b) => {
      const la = Math.max(...a[1].map(x => +new Date(x.created_at)));
      const lb = Math.max(...b[1].map(x => +new Date(x.created_at)));
      return lb - la;
    });
    const cards = sorted.map(([company, contacts]) => {
      const counts = {};
      FLAGS.forEach(f => counts[f] = contacts.filter(c => c[f]).length);
      counts.no_response = contacts.filter(c => !c.accepted && !c.replied && !c.warm_intro).length;
      const date = new Date(Math.max(...contacts.map(c => +new Date(c.created_at))));
      const ds = date.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      const flagSteps = [...FLAGS, 'no_response'];
      const flagLabels = {...FLAG_LABELS, no_response: 'No Response'};
      const flagClasses = { accepted:'f-accepted', replied:'f-replied', warm_intro:'f-warm_intro', no_response:'f-none' };
      const steps = flagSteps.map(s => `
        <div class="funnel-step">
          <span class="funnel-count ${flagClasses[s]}">${counts[s]}</span>
          <span class="funnel-label">${flagLabels[s].replace(' ','<br>')}</span>
        </div>`).join('');
      return `
        <div class="co-card">
          <div class="co-card-head">
            <div class="co-card-head-text">
              <h3>${esc(company)}</h3>
              <div class="co-meta">${contacts.length} contact${contacts.length!==1?'s':''} · Last run ${ds}</div>
            </div>
            <button class="co-expand-btn" title="View contacts" data-company="${esc(company)}" onclick="drillToContacts(this.dataset.company)">↗</button>
          </div>
          <div class="funnel">${steps}</div>
        </div>`;
    }).join('');
    vc.innerHTML = `<div class="company-grid">${cards}</div>`;
  }

  /* ── BY CONTACT ── */
  function renderContactView() {
    const vc = document.getElementById('view-container');
    if (!ALL_CONTACTS.length) {
      vc.innerHTML = `<div class="empty"><h3>No contacts yet</h3><p>Run the pipeline to start tracking.</p></div>`;
      return;
    }
    const companies = [...new Set(ALL_CONTACTS.map(c => c.company).filter(Boolean))].sort();
    const coOpts = companies.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

    vc.innerHTML = `
      <div class="contact-toolbar">
        <input class="filter-input" id="f-search" type="text" placeholder="Search name or company…" oninput="applyFilters()">
        <select class="filter-select" id="f-company" onchange="applyFilters()"><option value="">All companies</option>${coOpts}</select>
        <select class="filter-select" id="f-flag" onchange="applyFilters()">
          <option value="">All contacts</option>
          <option value="accepted">Accepted</option>
          <option value="replied">Replied</option>
          <option value="warm_intro">Warm Intro</option>
          <option value="no_response">No Response</option>
        </select>
        <select class="filter-select" id="f-priority" onchange="applyFilters()">
          <option value="">All priorities</option>
          <option value="high">🔴 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">⚪ Low</option>
        </select>
        <button class="csv-btn" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Contact</th><th>Priority</th><th>Status</th><th>Message</th><th>Notes</th><th>Follow-up</th><th>Added</th><th></th>
          </tr></thead>
          <tbody id="contact-tbody"></tbody>
        </table>
      </div>`;

    document.getElementById('f-search').value    = _search;
    document.getElementById('f-company').value  = _filterCompany;
    document.getElementById('f-flag').value      = _filterStatus;
    document.getElementById('f-priority').value  = _filterPriority;
    applyFilters();
  }

  function applyFilters() {
    _search          = (document.getElementById('f-search')?.value    || '').toLowerCase();
    _filterCompany   =  document.getElementById('f-company')?.value   || '';
    _filterStatus    =  document.getElementById('f-flag')?.value      || '';
    _filterPriority  =  document.getElementById('f-priority')?.value  || '';

    const today = new Date(); today.setHours(0,0,0,0);
    const filtered = ALL_CONTACTS.filter(c => {
      if (_filterStatus) {
        if (_filterStatus === 'no_response' && (c.accepted || c.replied || c.warm_intro)) return false;
        if (_filterStatus !== 'no_response' && !c[_filterStatus]) return false;
      }
      if (_filterPriority && (c.priority || 'medium') !== _filterPriority) return false;
      if (_filterCompany && c.company !== _filterCompany) return false;
      if (_search && !`${c.name} ${c.company}`.toLowerCase().includes(_search)) return false;
      return true;
    });

    const tbody = document.getElementById('contact-tbody');
    if (!tbody) return;
    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No contacts match.</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map((c, i) => {
      const added    = new Date(c.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const preview  = (c.message||'').substring(0,80)+((c.message||'').length>80?'…':'');
      const overdue  = c.follow_up_date && new Date(c.follow_up_date) < today;
      const status = topStatus(c);
      const statusLabel = status === 'sent' ? 'Sent' : FLAG_LABELS[status];
      const opts = [
        { key:'sent',       label:'Sent',       dot:'#b0adc0' },
        { key:'accepted',   label:'Accepted',   dot:'#7b6ef6' },
        { key:'replied',    label:'Replied',    dot:'#c471ed' },
        { key:'warm_intro', label:'Warm Intro', dot:'#ffb347' },
      ];
      const optHtml = opts.map(o => `
        <div class="status-option opt-${o.key}${status===o.key?' selected':''}"
          ${o.key==='sent' ? '' : `onclick="setStatus(${c.id},'${o.key}',event)"`}>
          <div class="opt-dot" style="background:${o.dot}"></div>
          ${o.label}
          <span class="opt-check">✓</span>
        </div>`).join('');
      const pri = c.priority || 'medium';
      const priDot = pri === 'high' ? '🔴' : pri === 'medium' ? '🟡' : '⚪';
      const priLabel = pri.charAt(0).toUpperCase() + pri.slice(1);
      return `
        <tr id="row-${c.id}">
          <td style="color:var(--muted);font-size:12px">${i+1}</td>
          <td class="name-cell">
            ${c.url ? `<a href="${esc(c.url)}" target="_blank">${esc(c.name||c.url)}</a>` : esc(c.name||'—')}
            <div class="co">${esc(c.company||'')}</div>
          </td>
          <td><span class="pri-badge pri-${pri}">${priDot} ${priLabel}</span></td>
          <td>
            <div class="status-wrap" id="sw-${c.id}">
              <div class="status-pill pill-${status}" onclick="toggleStatusDropdown(${c.id},event)">
                <div class="pill-dot"></div>${statusLabel}
              </div>
              <div class="status-dropdown" id="sd-${c.id}">${optHtml}</div>
            </div>
          </td>
          <td>
            <div class="msg-preview" onclick="toggleMsg(this)">${esc(preview)}</div>
            <div class="msg-full" onclick="toggleMsg(this)">${esc(c.message||'')}</div>
          </td>
          <td class="notes-cell">
            <div class="notes-view" onclick="startEditNotes(${c.id})" id="nv-${c.id}">${esc(c.notes||'')}</div>
            <textarea class="notes-input" id="ni-${c.id}"
              onblur="saveNotes(${c.id})"
              onkeydown="if(event.key==='Escape')cancelNotes(${c.id})"
            >${esc(c.notes||'')}</textarea>
          </td>
          <td>
            <input type="date" class="date-input${overdue?' overdue':''}" id="dt-${c.id}"
              value="${c.follow_up_date||''}" onchange="updateDate(${c.id},this.value)">
          </td>
          <td style="color:var(--muted);font-size:12px;white-space:nowrap">${added}</td>
          <td style="text-align:center">
            <button class="btn-trash" title="Delete contact" onclick="trashContact(${c.id}, event)">🗑</button>
          </td>
        </tr>`;
    }).join('');
  }

  function toggleMsg(el) {
    // el is either .msg-preview or .msg-full — both are direct children of the td
    el.parentElement.classList.toggle('msg-expanded');
  }

  function startEditNotes(id) {
    document.getElementById(`nv-${id}`).style.display = 'none';
    const inp = document.getElementById(`ni-${id}`);
    inp.style.display = 'block';
    inp.focus();
  }
  function cancelNotes(id) {
    const c = ALL_CONTACTS.find(x => x.id===id);
    document.getElementById(`ni-${id}`).value = c?.notes||'';
    document.getElementById(`ni-${id}`).style.display = 'none';
    document.getElementById(`nv-${id}`).style.display = '';
  }
  async function saveNotes(id) {
    const inp = document.getElementById(`ni-${id}`);
    const val = inp.value.trim();
    const c   = ALL_CONTACTS.find(x => x.id===id);
    if (!c || val === (c.notes||'')) { cancelNotes(id); return; }
    await patchContact(id, {notes: val});
    c.notes = val;
    const nv = document.getElementById(`nv-${id}`);
    nv.textContent = val;
    inp.style.display = 'none';
    nv.style.display  = '';
    renderStats();
  }

  function toggleStatusDropdown(id, e) {
    e.stopPropagation();
    const sd = document.getElementById(`sd-${id}`);
    const isOpen = sd.classList.contains('open');
    document.querySelectorAll('.status-dropdown.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) sd.classList.add('open');
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.status-dropdown.open').forEach(el => el.classList.remove('open'));
  });

  async function setStatus(id, newStatus, e) {
    e.stopPropagation();
    const c = ALL_CONTACTS.find(x => x.id===id);
    if (!c) return;

    // clicking the already-selected status resets to "sent"
    const current = topStatus(c);
    const target = current === newStatus ? null : newStatus;

    // build patch: clear all flags, then set the right ones
    const patch = { accepted: false, replied: false, warm_intro: false };
    if (target === 'accepted')   patch.accepted = true;
    if (target === 'replied')    { patch.accepted = true; patch.replied = true; }
    if (target === 'warm_intro') { patch.accepted = true; patch.replied = true; patch.warm_intro = true; }

    await patchContact(id, patch);
    Object.assign(c, patch);

    // re-render just this cell
    const sw = document.getElementById(`sw-${id}`);
    if (sw) {
      const status = topStatus(c);
      const statusLabel = status === 'sent' ? 'Sent' : FLAG_LABELS[status];
      const opts = [
        { key:'sent',       label:'Sent',       dot:'#b0adc0' },
        { key:'accepted',   label:'Accepted',   dot:'#7b6ef6' },
        { key:'replied',    label:'Replied',    dot:'#c471ed' },
        { key:'warm_intro', label:'Warm Intro', dot:'#ffb347' },
      ];
      const optHtml = opts.map(o => `
        <div class="status-option opt-${o.key}${status===o.key?' selected':''}"
          ${o.key==='sent' ? '' : `onclick="setStatus(${id},'${o.key}',event)"`}>
          <div class="opt-dot" style="background:${o.dot}"></div>
          ${o.label}
          <span class="opt-check">✓</span>
        </div>`).join('');
      sw.innerHTML = `
        <div class="status-pill pill-${status}" onclick="toggleStatusDropdown(${id},event)">
          <div class="pill-dot"></div>${statusLabel}
        </div>
        <div class="status-dropdown" id="sd-${id}">${optHtml}</div>`;
    }
    renderStats();
  }

  async function updateDate(id, date) {
    const c = ALL_CONTACTS.find(x => x.id===id);
    if (!c) return;
    await patchContact(id, {follow_up_date: date||null});
    c.follow_up_date = date||null;
    const today = new Date(); today.setHours(0,0,0,0);
    const el = document.getElementById(`dt-${id}`);
    if (el) el.classList.toggle('overdue', !!date && new Date(date) < today);
  }

  async function trashContact(id, e) {
    e.stopPropagation();
    await patchContact(id, {deleted: true});
    // Remove from local array and re-render
    ALL_CONTACTS = ALL_CONTACTS.filter(c => c.id !== id);
    renderStats();
    applyFilters();
  }

  async function patchContact(id, fields) {
    try {
      const res  = await fetch(`/contacts/${id}`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(fields),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      showToast('Saved ✓');
    } catch(e) {
      showToast('Save failed: ' + e.message, true);
    }
  }

  function exportCSV() {
    const cols = ['id','name','company','accepted','replied','warm_intro','notes','follow_up_date','url','message','created_at'];
    const rows = [cols.join(',')];
    for (const c of ALL_CONTACTS) {
      rows.push(cols.map(k => `"${(c[k]??'').toString().replace(/"/g,'""')}"`).join(','));
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.join('\n')], {type:'text/csv'}));
    a.download = `outreach-crm-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  let _tt;
  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = isError ? '#ff6b6b' : 'rgba(123,110,246,.5)';
    t.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Company arrow → switch to By Contact with filter pre-set ── */
  function drillToContacts(company) {
    _filterCompany = company;
    switchView('contact');
  }
</script>
</body>
</html>
