
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Outreach Pipeline</title>
  <style>
    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px;
    }
 
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
 
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
    }
 
    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 32px;
    }
 
    /* ── Form ── */
    .form-section {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
 
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
 
    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 20px;
    }
 
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
 
    textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: "SF Mono", "Fira Code", monospace;
      outline: none;
      resize: vertical;
      min-height: 140px;
      transition: border-color 0.15s;
      line-height: 1.6;
    }
 
    textarea:focus {
      border-color: #3b82f6;
    }
 
    .url-hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 6px;
      margin-bottom: 20px;
    }
 
    /* ── Button ── */
    .btn-generate {
      width: 100%;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
 
    .btn-generate:hover:not(:disabled) { background: #2563eb; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
 
    /* ── Spinner ── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 48px 0;
      gap: 16px;
    }
 
    .spinner-wrap.visible { display: flex; }
 
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2d3748;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .spinner-label {
      color: #64748b;
      font-size: 0.875rem;
    }
 
    /* ── Error ── */
    .error-box {
      display: none;
      background: #1f1315;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 14px 16px;
      color: #fca5a5;
      font-size: 0.875rem;
      margin-bottom: 16px;
    }
 
    .error-box.visible { display: block; }
 
    /* ── Results ── */
    .results-section { display: none; }
    .results-section.visible { display: block; }
 
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
 
    .results-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
    }
 
    .results-count {
      font-size: 0.8125rem;
      color: #64748b;
    }
 
    /* ── Table ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #2d3748;
      border-radius: 12px;
    }
 
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
 
    thead {
      background: #1a2035;
    }
 
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      border-bottom: 1px solid #2d3748;
      white-space: nowrap;
    }
 
    td {
      padding: 14px 16px;
      vertical-align: top;
      border-bottom: 1px solid #1e2433;
    }
 
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1a2035; }
 
    .td-sr {
      color: #475569;
      font-size: 0.8125rem;
      width: 40px;
    }
 
    .td-name {
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      min-width: 130px;
    }
 
    .td-pers {
      width: 90px;
    }
 
    .badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      white-space: nowrap;
    }
 
    .badge-yes {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }
 
    .badge-no {
      background: #1c1917;
      color: #a8a29e;
      border: 1px solid #44403c;
    }
 
    .td-url a {
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.8125rem;
      white-space: nowrap;
    }
 
    .td-url a:hover { text-decoration: underline; }
 
    .td-message {
      min-width: 320px;
      max-width: 480px;
    }
 
    .message-text {
      color: #cbd5e1;
      line-height: 1.55;
      word-break: break-word;
    }
 
    .char-count {
      font-size: 0.6875rem;
      margin-top: 6px;
    }
 
    .char-ok   { color: #4ade80; }
    .char-over { color: #f87171; }
 
    .td-copy {
      width: 80px;
      text-align: center;
    }
 
    /* ── Copy button ── */
    .btn-copy {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #94a3b8;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
 
    .btn-copy:hover {
      background: #2d3748;
      color: #e2e8f0;
    }
 
    .btn-copy.copied {
      background: #052e16;
      border-color: #166534;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
 
    <h1>LinkedIn Outreach Pipeline</h1>
    <p class="subtitle">Paste profile URLs → get personalized connection messages</p>
 
    <!-- ── Input Form ── -->
    <div class="form-section">
 
      <label for="company-input">Company Name</label>
      <input
        type="text"
        id="company-input"
        placeholder="e.g. Snowflake"
      />
 
      <label for="url-input">LinkedIn Profile URLs</label>
      <textarea
        id="url-input"
        placeholder="https://www.linkedin.com/in/john-doe&#10;https://www.linkedin.com/in/jane-smith&#10;https://www.linkedin.com/in/alex-jones"
      ></textarea>
      <p class="url-hint">One URL per line. Duplicates are removed automatically.</p>
 
      <button class="btn-generate" id="generate-btn" onclick="runPipeline()">
        Generate Messages
      </button>
 
    </div>
 
    <!-- ── Error ── -->
    <div class="error-box" id="error-box"></div>
 
    <!-- ── Spinner ── -->
    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
      <span class="spinner-label" id="spinner-label">Scraping profiles and writing messages…</span>
    </div>
 
    <!-- ── Results Table ── -->
    <div class="results-section" id="results-section">
      <div class="results-header">
        <span class="results-title">Results</span>
        <span class="results-count" id="results-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Personalized</th>
              <th>LinkedIn</th>
              <th>Message</th>
              <th>Copy</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>
 
  </div>
 
  <script>
    /**
     * What this script does in plain English:
     *
     * OLD approach (broken): one big fetch() call that waited for everything,
     *   then got back all results at once. This crashed because the server-side
     *   asyncio conflicted with Flask, and Render would time it out anyway.
     *
     * NEW approach (SSE streaming):
     *   1. We open a streaming connection to /generate using fetch() with a
     *      ReadableStream reader.
     *   2. The backend sends us one JSON object at a time, as each profile
     *      finishes. Each chunk is prefixed with "data: " (SSE format).
     *   3. We parse each chunk as it arrives:
     *      - "status" events → update the spinner label
     *      - "result" events → add a row to the table immediately
     *      - "done" event   → hide the spinner, show final count
     *      - "error" event  → show the error box
     *   4. Rows appear one by one as the pipeline runs — no waiting for the
     *      full batch to finish.
     *
     * Copy button: copies just the message text to clipboard, turns green briefly.
     */
 
    let resultCount = 0;  // track how many rows have been added
 
    async function runPipeline() {
      const companyInput   = document.getElementById("company-input").value.trim();
      const urlRaw         = document.getElementById("url-input").value.trim();
      const errorBox       = document.getElementById("error-box");
      const spinner        = document.getElementById("spinner");
      const resultsSection = document.getElementById("results-section");
      const tbody          = document.getElementById("results-body");
      const btn            = document.getElementById("generate-btn");
 
      // Reset UI
      errorBox.classList.remove("visible");
      errorBox.textContent = "";
      resultsSection.classList.remove("visible");
      tbody.innerHTML = "";
      resultCount = 0;
 
      if (!companyInput) { showError("Please enter a company name."); return; }
      if (!urlRaw)        { showError("Please paste at least one LinkedIn URL."); return; }
 
      const urls = urlRaw
        .split("\n")
        .map(u => u.trim())
        .filter(u => u.startsWith("https://www.linkedin.com/in/"));
 
      if (urls.length === 0) {
        showError("No valid LinkedIn profile URLs found. Each URL should start with https://www.linkedin.com/in/");
        return;
      }
 
      spinner.classList.add("visible");
      document.getElementById("spinner-label").textContent =
        `Starting pipeline for ${urls.length} profile${urls.length !== 1 ? "s" : ""}…`;
      btn.disabled = true;
 
      try {
        // Open the streaming connection to the backend
        const response = await fetch("/generate", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ urls, company: companyInput }),
        });
 
        if (!response.ok) {
          throw new Error(`Server error ${response.status}`);
        }
 
        // ReadableStream lets us process the response body chunk by chunk
        // as it arrives, without waiting for it to finish.
        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";
 
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
 
          // Decode the binary chunk into text and add to buffer
          buffer += decoder.decode(value, { stream: true });
 
          // SSE messages are separated by double newlines (\n\n).
          // We split on that to handle multiple messages arriving in one chunk.
          const parts = buffer.split("\n\n");
 
          // The last part may be incomplete — keep it in the buffer
          buffer = parts.pop();
 
          for (const part of parts) {
            // Each SSE line looks like:  data: {"event": "result", ...}
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;
 
            try {
              const msg = JSON.parse(line.slice(6));  // strip "data: " prefix
 
              if (msg.event === "status") {
                // Update the spinner text with the current pipeline step
                document.getElementById("spinner-label").textContent = msg.message;
 
              } else if (msg.event === "result") {
                // A profile is done — add it to the table immediately
                appendRow(msg);
                resultCount++;
                document.getElementById("results-count").textContent =
                  `${resultCount} message${resultCount !== 1 ? "s" : ""} generated`;
 
                // Show the table on the first result
                if (resultCount === 1) {
                  resultsSection.classList.add("visible");
                  resultsSection.scrollIntoView({ behavior: "smooth", block: "start" });
                }
 
              } else if (msg.event === "done") {
                // Pipeline finished
                spinner.classList.remove("visible");
                btn.disabled = false;
                if (resultCount === 0) {
                  showError("No results returned. All profiles may have been filtered (company mismatch) or scrapers returned no data.");
                }
 
              } else if (msg.event === "error") {
                showError("Pipeline error: " + msg.message);
                spinner.classList.remove("visible");
                btn.disabled = false;
              }
 
            } catch (e) {
              // Malformed JSON in one chunk — skip it, keep going
              console.warn("Could not parse SSE chunk:", line, e);
            }
          }
        }
 
      } catch (err) {
        showError("Something went wrong: " + err.message);
      } finally {
        spinner.classList.remove("visible");
        btn.disabled = false;
      }
    }
 
 
    function appendRow(row) {
      /**
       * Adds one row to the results table.
       * Called as each "result" SSE event arrives.
       */
      const tbody     = document.getElementById("results-body");
      const charClass = row.char_count <= 300 ? "char-ok" : "char-over";
      const charLabel = row.char_count <= 300
        ? `${row.char_count} chars`
        : `${row.char_count} chars — OVER by ${row.char_count - 300}`;
 
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="td-sr">${row.sr}</td>
        <td class="td-name">${escHtml(row.name)}</td>
        <td class="td-pers">
          <span class="badge ${row.personalized === 'Yes' ? 'badge-yes' : 'badge-no'}">
            ${row.personalized}
          </span>
        </td>
        <td class="td-url">
          <a href="${escHtml(row.url)}" target="_blank" rel="noopener">View Profile</a>
        </td>
        <td class="td-message">
          <div class="message-text">${escHtml(row.message)}</div>
          <div class="char-count ${charClass}">${charLabel}</div>
        </td>
        <td class="td-copy">
          <button class="btn-copy" onclick="copyMessage(this, ${JSON.stringify(row.message)})">
            Copy
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    }
 
 
    function copyMessage(btn, message) {
      navigator.clipboard.writeText(message).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1800);
      });
    }
 
 
    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.classList.add("visible");
    }
 
 
    function escHtml(str) {
      // Prevents scraped data from being interpreted as HTML
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
