<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Outreach Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --grad-start: #ffb347;
      --grad-mid:   #c471ed;
      --grad-end:   #7b6ef6;
      --grad: linear-gradient(135deg, var(--grad-start), var(--grad-mid), var(--grad-end));
      --bg: #f5e6d8;
      --surface: rgba(255,255,255,0.55);
      --card: rgba(255,255,255,0.52);
      --border: rgba(255,255,255,0.6);
      --text-primary: #1a1035;
      --text-secondary: #7c7a8e;
      --text-muted: #b0adc0;
      --glass-shadow: 0 8px 32px rgba(120,80,40,0.10), 0 1.5px 0 rgba(255,255,255,0.7) inset;
      --glass-blur: blur(18px);
    }

    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: #f5e6d8;
      background-image:
        radial-gradient(ellipse 70% 55% at 100% 0%, #f0b488 0%, transparent 50%),
        radial-gradient(ellipse 55% 50% at 100% 100%, #c94f72 0%, transparent 50%),
        radial-gradient(ellipse 50% 45% at 0% 100%,  #7744aa 0%, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-primary);
      padding: 0 0 80px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 0;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      justify-content: center;
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 10;
      pointer-events: none;
    }
    .nav-capsule {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: rgba(253,240,224,0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 4px 24px rgba(120,80,20,0.12), 0 1px 0 rgba(255,255,255,0.7) inset;
    }
    .nav-pill {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      transition: all .2s;
      white-space: nowrap;
      cursor: pointer;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .nav-pill:hover { color: var(--text-primary); background: rgba(255,255,255,0.5); }
    .nav-pill.active {
      background: transparent;
      color: var(--text-primary);
      border: 1.5px solid transparent;
      background-image: linear-gradient(rgba(253,240,224,0.0), rgba(253,240,224,0.0)),
                        var(--grad);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 1px 6px rgba(196,113,237,0.18);
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .header h1 .grad-word {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* ── Form card ── */
    .form-card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 8px 32px rgba(120,80,40,0.10), 0 1.5px 0 rgba(255,255,255,0.7) inset;
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .field-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .company-input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--border);
      background: transparent;
      padding: 8px 0 10px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      margin-bottom: 28px;
      transition: border-color 0.2s;
      font-weight: 500;
    }

    .company-input::placeholder { color: var(--text-muted); font-weight: 400; }
    .company-input:focus { border-bottom-color: #c471ed; }

    /* ── URL chip input ── */
    .chip-field-wrap {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 80px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      cursor: text;
      transition: border-color 0.2s;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.4);
    }

    .chip-field-wrap:focus-within { border-color: #c471ed; }

    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(255,179,71,0.12), rgba(196,113,237,0.12));
      border: 1px solid rgba(196,113,237,0.25);
      border-radius: 6px;
      padding: 3px 8px 3px 6px;
      font-size: 0.78rem;
      color: var(--text-primary);
      font-weight: 500;
      max-width: 260px;
    }

    .url-chip .li-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #0077b5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .url-chip .li-icon svg { display: block; }

    .url-chip .chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-chip .chip-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1;
      padding: 0 0 0 2px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .url-chip .chip-remove:hover { color: #c471ed; }

    .chip-textarea {
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text-primary);
      resize: none;
      flex: 1;
      min-width: 180px;
      min-height: 28px;
      line-height: 1.6;
    }

    .chip-textarea::placeholder { color: var(--text-muted); }

    .url-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .url-count {
      font-weight: 600;
      color: #c471ed;
    }

    /* ── Generate button ── */
    .btn-generate {
      width: 100%;
      background: var(--grad);
      background-size: 200% 200%;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 0.9375rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-generate:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* progress fill overlay */
    .btn-generate .btn-progress {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.15);
      width: 0%;
      transition: width 0.4s ease;
    }

    .btn-generate .btn-label {
      position: relative;
      z-index: 1;
    }

    /* ── Status ticker ── */
    .status-ticker {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 0 0;
      font-size: 0.8125rem;
      color: var(--text-secondary);
    }

    .status-ticker.visible { display: flex; }

    .ticker-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--grad);
      background: linear-gradient(135deg, #ffb347, #c471ed);
      flex-shrink: 0;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Error ── */
    .error-box {
      display: none;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px 16px;
      color: #b91c1c;
      font-size: 0.875rem;
      margin-bottom: 20px;
    }

    .error-box.visible { display: block; }

    /* ── Results ── */
    .results-section { display: none; }
    .results-section.visible { display: block; }

    .results-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    .results-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .results-count {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ── Table ── */
    .table-card {
      background: var(--card);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(120,80,40,0.10), 0 1.5px 0 rgba(255,255,255,0.7) inset;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead {
      background: linear-gradient(to right, rgba(255,179,71,0.06), rgba(196,113,237,0.06));
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 13px 16px;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    td {
      padding: 16px 16px;
      vertical-align: top;
      border-bottom: 1px solid #f5f0fc;
    }

    tr:last-child td { border-bottom: none; }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:hover td { background: #fdfaff; }

    /* gradient left accent per row */
    tbody tr td:first-child {
      position: relative;
    }

    tbody tr td:first-child::before {
      content: "";
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--grad);
      opacity: 0;
      transition: opacity 0.2s;
    }

    tbody tr:hover td:first-child::before { opacity: 1; }

    .td-sr {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      width: 36px;
    }

    .td-name {
      min-width: 130px;
    }

    .name-text {
      font-weight: 700;
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .td-pers { width: 100px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .badge-yes {
      background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(196,113,237,0.15));
      color: #9333ea;
      border: 1px solid rgba(196,113,237,0.3);
    }

    .badge-no {
      background: #f5f5f5;
      color: var(--text-muted);
      border: 1px solid #e5e5e5;
    }

    .badge-warn {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }

    .td-url a {
      color: #7b6ef6;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .td-url a:hover { text-decoration: underline; }

    .td-message { min-width: 300px; max-width: 420px; }

    .message-text {
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 0.875rem;
    }

    .char-bar-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .char-bar-track {
      flex: 1;
      height: 3px;
      background: #ede8f5;
      border-radius: 99px;
      overflow: hidden;
    }

    .char-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--grad);
      transition: width 0.4s ease;
    }

    .char-bar-fill.over { background: linear-gradient(to right, #f97316, #ef4444); }

    .char-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .char-label.over { color: #ef4444; }

    .td-copy { width: 70px; text-align: center; }

    .btn-copy {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      padding: 5px 11px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-copy:hover {
      border-color: #c471ed;
      color: #c471ed;
    }

    .btn-copy.copied {
      background: linear-gradient(135deg, rgba(255,179,71,0.12), rgba(196,113,237,0.12));
      border-color: #c471ed;
      color: #9333ea;
    }

    /* ── Row entrance animation ── */
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .row-new {
      animation: rowIn 0.3s ease forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .row-new { animation: none; }
    }

    /* ── Run History ── */
    .history-section {
      margin-top: 48px;
    }
    .history-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }
    .history-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .history-count {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .run-list { display: flex; flex-direction: column; gap: 10px; }

    .run-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(120,80,40,0.10), 0 1.5px 0 rgba(255,255,255,0.7) inset;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .run-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    .run-card-head:hover { background: rgba(255,255,255,0.7); }
    .run-card-head .run-company {
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--text-primary);
      flex: 1;
    }
    .run-card-head .run-meta {
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .run-card-head .run-chevron {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform .2s;
    }
    .run-card.open .run-chevron { transform: rotate(180deg); }

    .run-card-body {
      display: none;
      border-top: 1px solid var(--border);
    }
    .run-card.open .run-card-body { display: block; }

    .run-contacts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8375rem;
    }
    .run-contacts-table thead {
      background: linear-gradient(to right, rgba(255,179,71,0.05), rgba(196,113,237,0.05));
    }
    .run-contacts-table th {
      padding: 10px 16px;
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .run-contacts-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f5f0fc;
      vertical-align: top;
    }
    .run-contacts-table tr:last-child td { border-bottom: none; }
    .run-contacts-table tbody tr:hover td { background: #fdfaff; }
    .rct-name a { color: var(--text-primary); font-weight: 600; text-decoration: none; }
    .rct-name a:hover { color: #7b6ef6; }
    .rct-msg {
      color: var(--text-secondary);
      line-height: 1.55;
      max-width: 400px;
    }
    .rct-copy {
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .rct-copy:hover { border-color: #c471ed; color: #c471ed; }
    .rct-copy.copied { background: linear-gradient(135deg,rgba(255,179,71,.12),rgba(196,113,237,.12)); border-color:#c471ed; color:#9333ea; }

    .history-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .history-loader {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .header h1 { font-size: 2rem; }
      .form-card { padding: 24px 18px; }
      .td-message { min-width: 200px; }
      table { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-capsule">
      <a href="/" class="nav-pill">Home</a>
      <div class="nav-divider"></div>
      <a href="/outreach" class="nav-pill active">Pipeline</a>
      <a href="/dashboard" class="nav-pill">Dashboard</a>
      <a href="/crm" class="nav-pill">CRM</a>
    </div>
  </nav>

  <div class="container">

    <header class="header">
      <h1>LinkedIn <span class="grad-word">Outreach</span> Pipeline</h1>
      <p>Paste profile URLs → get personalized connection messages</p>
    </header>

    <div class="form-card">

      <label class="field-label" for="company-input">Company Name</label>
      <input
        type="text"
        id="company-input"
        class="company-input"
        placeholder="e.g. Snowflake"
        autocomplete="off"
      />

      <label class="field-label">LinkedIn Profile URLs</label>
      <div class="chip-field-wrap" id="chip-field" onclick="document.getElementById('chip-input').focus()">
        <!-- chips injected here by JS -->
        <textarea
          id="chip-input"
          class="chip-textarea"
          placeholder="Paste URLs here, one per line…"
          rows="1"
        ></textarea>
      </div>
      <p class="url-hint">
        <span id="url-count-text">No URLs added yet.</span>
        Duplicates removed automatically.
      </p>

      <button class="btn-generate" id="generate-btn" onclick="runPipeline()">
        <div class="btn-progress" id="btn-progress"></div>
        <span class="btn-label" id="btn-label">Generate Messages</span>
      </button>

      <div class="status-ticker" id="status-ticker">
        <div class="ticker-dot"></div>
        <span id="ticker-text">Starting…</span>
      </div>

    </div>

    <div class="error-box" id="error-box"></div>

    <div class="results-section" id="results-section">
      <div class="results-header">
        <span class="results-title">Personalized messages</span>
        <span class="results-count" id="results-count"></span>
      </div>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Personalized</th>
              <th>LinkedIn</th>
              <th>Message</th>
              <th>Copy</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ── Past Runs ── -->
    <div class="history-section">
      <div class="history-header">
        <span class="history-title">Past Runs</span>
        <span class="history-count" id="history-count"></span>
      </div>
      <div id="run-list-container">
        <div class="history-loader">Loading history…</div>
      </div>
    </div>

  </div>

  <script>
    /* ── Chip URL input ── */
    const chipField = document.getElementById("chip-field");
    const chipInput = document.getElementById("chip-input");
    const urlCountText = document.getElementById("url-count-text");
    let chipUrls = []; // ordered list of deduped URLs

    function renderChips() {
      // Remove all existing chips
      chipField.querySelectorAll(".url-chip").forEach(c => c.remove());

      // Re-insert before the textarea
      chipUrls.forEach((url, i) => {
        const slug = url.replace("https://www.linkedin.com/in/", "").replace(/\/$/, "");
        const chip = document.createElement("div");
        chip.className = "url-chip";
        chip.innerHTML = `
          <span class="li-icon">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <rect width="10" height="10" rx="2" fill="#0077b5"/>
              <text x="2" y="8" font-size="7" fill="white" font-family="sans-serif" font-weight="bold">in</text>
            </svg>
          </span>
          <span class="chip-text" title="${url}">${slug}</span>
          <button class="chip-remove" data-idx="${i}" title="Remove">×</button>
        `;
        chipField.insertBefore(chip, chipInput);
      });

      // Update count label
      const n = chipUrls.length;
      urlCountText.innerHTML = n === 0
        ? "No URLs added yet."
        : `<span class="url-count">${n} URL${n !== 1 ? "s" : ""} added.</span>`;
    }

    function addUrlsFromText(text) {
      const lines = text.split(/[\n,]+/).map(l => l.trim()).filter(Boolean);
      let added = 0;
      lines.forEach(line => {
        // Accept with or without https://www.
        let url = line;
        if (url.startsWith("linkedin.com")) url = "https://www." + url;
        if (url.startsWith("www.linkedin.com")) url = "https://" + url;
        if (url.includes("linkedin.com/in/") && !chipUrls.includes(url)) {
          // Normalise to https://www.linkedin.com/in/slug/
          const match = url.match(/linkedin\.com\/in\/([^/?#]+)/);
          if (match) {
            const canonical = `https://www.linkedin.com/in/${match[1]}/`;
            if (!chipUrls.includes(canonical)) {
              chipUrls.push(canonical);
              added++;
            }
          }
        }
      });
      if (added > 0) renderChips();
      return added;
    }

    // Remove chip on × click
    chipField.addEventListener("click", e => {
      if (e.target.classList.contains("chip-remove")) {
        const idx = parseInt(e.target.dataset.idx, 10);
        chipUrls.splice(idx, 1);
        renderChips();
      }
    });

    // Parse pasted text into chips
    chipInput.addEventListener("paste", e => {
      e.preventDefault();
      const text = e.clipboardData.getData("text");
      addUrlsFromText(text);
      chipInput.value = "";
    });

    // Parse typed text on Enter or newline
    chipInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        addUrlsFromText(chipInput.value);
        chipInput.value = "";
      }
    });

    // Also catch any remaining text on blur
    chipInput.addEventListener("blur", () => {
      if (chipInput.value.trim()) {
        addUrlsFromText(chipInput.value);
        chipInput.value = "";
      }
    });

    /* ── Pipeline ── */
    let resultCount = 0;
    let totalUrls = 0;

    async function runPipeline() {
      const company  = document.getElementById("company-input").value.trim();
      const errorBox = document.getElementById("error-box");
      const ticker   = document.getElementById("status-ticker");
      const resultsSection = document.getElementById("results-section");
      const tbody    = document.getElementById("results-body");
      const btn      = document.getElementById("generate-btn");
      const btnLabel = document.getElementById("btn-label");
      const btnProg  = document.getElementById("btn-progress");

      // Also pick up anything still typed in the chip input
      if (chipInput.value.trim()) {
        addUrlsFromText(chipInput.value);
        chipInput.value = "";
      }

      errorBox.classList.remove("visible");
      resultsSection.classList.remove("visible");
      tbody.innerHTML = "";
      resultCount = 0;

      if (!company)          { showError("Please enter a company name."); return; }
      if (chipUrls.length === 0) { showError("Please add at least one LinkedIn profile URL."); return; }

      totalUrls = chipUrls.length;
      btn.disabled = true;
      btnLabel.textContent = `Scraping ${totalUrls} profile${totalUrls !== 1 ? "s" : ""}…`;
      btnProg.style.width = "0%";
      ticker.classList.add("visible");

      try {
        const response = await fetch("/generate", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ urls: chipUrls, company }),
        });

        if (!response.ok) throw new Error(`Server error ${response.status}`);

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();

          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith("data: ")) continue;
            try {
              const msg = JSON.parse(line.slice(6));

              if (msg.event === "status") {
                document.getElementById("ticker-text").textContent = msg.message;
                btnLabel.textContent = msg.message.length > 50
                  ? msg.message.slice(0, 50) + "…"
                  : msg.message;

              } else if (msg.event === "result") {
                appendRow(msg);
                resultCount++;
                document.getElementById("results-count").textContent =
                  `${resultCount} of ${totalUrls}`;
                // progress bar
                btnProg.style.width = `${Math.round((resultCount / totalUrls) * 100)}%`;

                if (resultCount === 1) {
                  resultsSection.classList.add("visible");
                  resultsSection.scrollIntoView({ behavior: "smooth", block: "start" });
                }

              } else if (msg.event === "done") {
                ticker.classList.remove("visible");
                btn.disabled = false;
                btnLabel.textContent = `Done — ${resultCount} message${resultCount !== 1 ? "s" : ""}`;
                btnProg.style.width = "100%";
                document.getElementById("results-count").textContent =
                  `${resultCount} message${resultCount !== 1 ? "s" : ""} generated`;
                if (window._pipelineDoneHook) window._pipelineDoneHook();
                setTimeout(() => {
                  btnLabel.textContent = "Generate Messages";
                  btnProg.style.width = "0%";
                }, 3000);
                if (resultCount === 0) {
                  showError("No results returned. All profiles may have been filtered or scrapers returned no data.");
                }

              } else if (msg.event === "error") {
                showError("Pipeline error: " + msg.message);
                ticker.classList.remove("visible");
                btn.disabled = false;
                btnLabel.textContent = "Generate Messages";
              }
            } catch (e) {
              console.warn("Could not parse SSE chunk:", line, e);
            }
          }
        }
      } catch (err) {
        showError("Something went wrong: " + err.message);
      } finally {
        ticker.classList.remove("visible");
        btn.disabled = false;
        if (btnLabel.textContent !== "Generate Messages" &&
            !btnLabel.textContent.startsWith("Done")) {
          btnLabel.textContent = "Generate Messages";
        }
      }
    }

    function appendRow(row) {
      const tbody = document.getElementById("results-body");
      const isWarn = row.message && row.message.startsWith("⚠️");
      const charPct = Math.min(100, Math.round((row.char_count / 300) * 100));
      const isOver  = row.char_count > 300;
      const charLabel = row.char_count === 0 ? "" :
        isOver
          ? `${row.char_count} / 300 — over`
          : `${row.char_count} / 300`;

      let badgeClass = "badge-no", badgeLabel = row.personalized;
      if (isWarn) { badgeClass = "badge-warn"; badgeLabel = "Not found"; }
      else if (row.personalized === "Yes") badgeClass = "badge-yes";

      const tr = document.createElement("tr");
      tr.className = "row-new";
      tr.innerHTML = `
        <td class="td-sr">${row.sr}</td>
        <td class="td-name"><span class="name-text">${escHtml(row.name)}</span></td>
        <td class="td-pers">
          <span class="badge ${badgeClass}">${badgeLabel}</span>
        </td>
        <td class="td-url">
          <a href="${escHtml(row.url)}" target="_blank" rel="noopener">View ↗</a>
        </td>
        <td class="td-message">
          <div class="message-text">${escHtml(row.message)}</div>
          ${row.char_count > 0 ? `
          <div class="char-bar-wrap">
            <div class="char-bar-track">
              <div class="char-bar-fill ${isOver ? 'over' : ''}" style="width:${charPct}%"></div>
            </div>
            <span class="char-label ${isOver ? 'over' : ''}">${charLabel}</span>
          </div>` : ""}
        </td>
        <td class="td-copy">
          ${!isWarn ? `<button class="btn-copy" onclick="copyMessage(this, ${JSON.stringify(row.message)})">Copy</button>` : ""}
        </td>
      `;
      tbody.appendChild(tr);
    }

    function _doCopy(text, btn) {
      const done = () => {
        btn.textContent = "✓ Copied";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => _fallbackCopy(text, btn, done));
      } else {
        _fallbackCopy(text, btn, done);
      }
    }
    function _fallbackCopy(text, btn, done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand("copy"); done(); } catch(e) {}
      document.body.removeChild(ta);
    }
    function copyMessage(btn, message) { _doCopy(message, btn); }

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = msg;
      box.classList.add("visible");
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* ── Run History ── */
    async function loadHistory() {
      const container = document.getElementById("run-list-container");
      try {
        const res  = await fetch("/history?limit=50");
        const runs = await res.json();
        if (!Array.isArray(runs) || runs.length === 0) {
          container.innerHTML = `<div class="history-empty">No past runs yet. Generate your first batch above.</div>`;
          return;
        }
        document.getElementById("history-count").textContent = `${runs.length} run${runs.length !== 1 ? "s" : ""}`;
        container.innerHTML = `<div class="run-list">${runs.map(renderRunCard).join("")}</div>`;
      } catch (e) {
        container.innerHTML = `<div class="history-empty">Could not load history: ${escHtml(e.message)}</div>`;
      }
    }

    function renderRunCard(run) {
      const date = new Date(run.created_at).toLocaleDateString("en-US", {
        month: "short", day: "numeric", year: "numeric",
      });
      const time = new Date(run.created_at).toLocaleTimeString("en-US", {
        hour: "numeric", minute: "2-digit",
      });
      const msgs = Array.isArray(run.messages) ? run.messages : [];
      const count = msgs.length || (run.total_profiles || 0);
      return `
        <div class="run-card" id="run-${run.id}">
          <div class="run-card-head" onclick="toggleRun('${run.id}', ${JSON.stringify(msgs).replace(/"/g,'&quot;')})">
            <span class="run-company">${escHtml(run.company || "Unknown")}</span>
            <span class="run-meta">${count} contact${count !== 1 ? "s" : ""} · ${date} at ${time}</span>
            <span class="run-chevron">▼</span>
          </div>
          <div class="run-card-body" id="run-body-${run.id}"></div>
        </div>`;
    }

    function toggleRun(runId, results) {
      const card = document.getElementById(`run-${runId}`);
      const body = document.getElementById(`run-body-${runId}`);
      const isOpen = card.classList.toggle("open");
      if (isOpen && !body._loaded) {
        body._loaded = true;
        if (!results || results.length === 0) {
          body.innerHTML = `<div class="history-empty" style="padding:24px">No contact details stored for this run.</div>`;
        } else {
          const rows = results.map((r, i) => {
            const nameHtml = r.url
              ? `<a href="${escHtml(r.url)}" target="_blank">${escHtml(r.name || r.url)}</a>`
              : escHtml(r.name || "—");
            return `
              <tr>
                <td style="color:var(--text-muted);font-size:.78rem;width:32px">${i + 1}</td>
                <td class="rct-name">${nameHtml}</td>
                <td class="rct-msg">${escHtml(r.message || "")}</td>
                <td style="white-space:nowrap">
                  ${r.message ? `<button class="rct-copy" onclick="copyRct(this,${JSON.stringify(r.message)})">Copy</button>` : ""}
                </td>
              </tr>`;
          }).join("");
          body.innerHTML = `
            <table class="run-contacts-table">
              <thead><tr>
                <th>#</th><th>Contact</th><th>Message</th><th></th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>`;
        }
      }
    }

    function copyRct(btn, msg) { _doCopy(msg, btn); }

    // Refresh history after a successful pipeline run
    const _origDone = window._pipelineDoneHook;
    window._pipelineDoneHook = function() {
      if (_origDone) _origDone();
      setTimeout(loadHistory, 3000); // give supabase time to log
    };

    document.addEventListener("DOMContentLoaded", loadHistory);
  </script>
</body>
</html>
