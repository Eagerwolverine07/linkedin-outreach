<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Tracker · Job Search OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .sync-badge { font-family: var(--mono); font-size: 12px; }

    /* ── filters ── */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 18px;
    }
    .filter-bar .dl-btn { margin-left: auto; }

    /* ── table ── */
    .table-card table { min-width: 880px; }
    .table-card { overflow-x: auto; }
    tbody td { vertical-align: middle; }

    .company-name { font-weight: 600; font-size: 14px; }
    .role-name { margin-top: 2px; font-size: 12.5px; color: var(--ink-soft); }
    .contact-cell { font-size: 13px; color: var(--ink-mid); }

    /* ── stage badges ───────────────────────────────────────────
       Same ramp as the outreach funnel: the closer to an offer,
       the deeper the green. A rejection stays neutral — it has
       already cost enough without shouting in red.              */
    .status-select {
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      width: auto;
      min-width: 118px;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      text-align: center;
    }
    .status-select:focus { box-shadow: 0 0 0 3px rgba(21,32,46,.08); }

    .badge-applied      { background: var(--surface);     border: 1px solid var(--rule-strong) !important; color: var(--ink-mid); }
    .badge-screening    { background: #EFF4F1;            border: 1px solid #C9DCD1 !important;            color: #3F7458; }
    .badge-interviewing { background: var(--signal-tint); border: 1px solid var(--signal-rule) !important; color: #2C7555; }
    .badge-offer        { background: var(--signal);      border: 1px solid var(--signal) !important;      color: #FFFFFF; }
    .badge-rejected     { background: var(--closed-tint); border: 1px solid var(--rule-strong) !important; color: var(--closed); }

    /* ── interviewed chip ── */
    .stage-chips { display: flex; gap: 6px; }
    .chip { font-size: 12.5px; padding: 5px 11px; }
    .chip.on {
      background: var(--signal-tint);
      border-color: var(--signal-rule);
      color: var(--signal);
      font-weight: 500;
    }
    .chip.saving { opacity: .5; pointer-events: none; }

    /* ── referral ── */
    .referral-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      font-family: var(--sans);
      font-size: 12.5px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      cursor: pointer;
      transition: background .12s ease, color .12s ease, border-color .12s ease;
    }
    .referral-btn:hover { color: var(--ink); border-color: var(--ink-mid); }
    .referral-btn.on {
      background: var(--signal-tint);
      border-color: var(--signal-rule);
      color: var(--signal);
      font-weight: 500;
    }

    /* ── empty + loading row ── */
    .state-row td {
      padding: 40px 20px;
      text-align: center;
      color: var(--ink-mid);
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      margin-right: 9px;
      vertical-align: -2px;
      border: 2px solid var(--rule);
      border-top-color: var(--ink-mid);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    /* ── modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(21,32,46,.38);
      padding: 24px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; align-items: flex-start; justify-content: center; }

    .modal {
      width: 100%;
      max-width: 450px;
      margin: 40px auto;
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 44px rgba(21,32,46,.16);
    }
    .modal h2 { font-size: 18px; margin-bottom: 20px; }
    .modal label {
      display: block;
      margin: 15px 0 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }
    .modal textarea { min-height: 78px; resize: vertical; }

    .check-row { margin-top: 16px; }
    .check-row label {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-weight: 400;
      color: var(--ink-mid);
      cursor: pointer;
    }
    .check-row input { width: auto; accent-color: var(--signal); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }

    @media (max-width: 720px) {
      .filter-bar .dl-btn { margin-left: 0; }
      .header { gap: 10px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-capsule">
      <a href="/" class="nav-pill">Home</a>
      <a href="/tracker" class="nav-pill active">Applications</a>
      <a href="/outreach" class="nav-pill">Outreach</a>
      <a href="/dashboard" class="nav-pill">Dashboard</a>
      <a href="/crm" class="nav-pill">Contacts</a>
    </div>
  </nav>

  <div class="page">

    <div class="header">
      <h1 class="page-title">Applications</h1>
      <div class="sync-badge" id="syncBadge">Synced <span>—</span></div>
    </div>

    <!-- stats row -->
    <div class="stats">
      <div class="stat-card">
        <div class="val" id="statTotal">—</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-card">
        <div class="val" id="statActive">—</div>
        <div class="lbl">Active</div>
      </div>
      <div class="stat-card">
        <div class="val" id="statInterviewing">—</div>
        <div class="lbl">Interviewing</div>
      </div>

      <div class="stat-card">
        <div class="val" id="statOffers">—</div>
        <div class="lbl">Offers</div>
      </div>
      <div class="stat-card referral-card">
        <div class="val" id="statReferrals">—</div>
        <div class="lbl">Referrals</div>
      </div>
    </div>

    <!-- filter bar -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="applied">Applied</button>
      <button class="filter-btn" data-status="screening">Screening</button>
      <button class="filter-btn" data-status="interviewing">Interviewing</button>
      <button class="filter-btn" data-status="offer">Offer</button>
      <button class="filter-btn" data-status="rejected">Rejected</button>
      <button class="filter-btn" data-status="referral">Referral</button>
      <button class="dl-btn" id="dlBtn" onclick="downloadCsv()">Download CSV</button>
      <button class="add-btn" id="addBtn" onclick="openAddModal()">Add application</button>
    </div>

    <!-- add modal -->
    <div class="modal-backdrop" id="addModal">
      <div class="modal">
        <h2 id="modalTitle">Add an application</h2>
        <label for="fCompany">Company *</label>
        <input id="fCompany" type="text" placeholder="e.g. Metaview" />
        <label for="fRole">Role</label>
        <input id="fRole" type="text" placeholder="e.g. Sales Development Representative" />
        <label for="fStatus">Stage</label>
        <select id="fStatus">
          <option value="applied">Applied</option>
          <option value="screening">Screening</option>
          <option value="interviewing">Interviewing</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
        <div class="check-row">
          <label><input type="checkbox" id="fInterview" /> Had a screening / interview</label>
        </div>
        <label for="fDate" id="fDateLabel">Date</label>
        <input id="fDate" type="date" />
        <div id="fLastWrap" style="display:none">
          <label for="fLast">Last activity</label>
          <input id="fLast" type="date" />
        </div>
        <label for="fContact">Contact</label>
        <input id="fContact" type="text" placeholder="Recruiter / interviewer name" />
        <label for="fNotes">Notes</label>
        <textarea id="fNotes" placeholder="Round, interviewer, prep notes…"></textarea>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
          <button class="btn-save" id="saveBtn" onclick="saveApp()">Save</button>
        </div>
      </div>
    </div>

    <!-- table -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Company and role</th>
            <th>Status</th>
            <th>Progress</th>
            <th>Referral</th>
            <th>Applied</th>
            <th>Last activity</th>
            <th>Contact</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="state-row">
            <td colspan="8"><span class="spinner"></span>Loading applications…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="footer">Gmail sync runs every morning at 11am.</p>
  </div>

  <script>
    let allApps = [];
    let currentFilter = 'all';

    const BADGE = {
      applied:      'badge-applied',
      screening:    'badge-screening',
      interviewing: 'badge-interviewing',
      offer:        'badge-offer',
      rejected:     'badge-rejected',
    };

    function fmtDate(d) {
      if (!d) return '—';
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function referralBtnHtml(appId, isOn) {
      const cls = 'referral-btn' + (isOn ? ' on' : '');
      const icon = isOn
        ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
        : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
      const label = isOn ? 'Referral' : 'Mark';
      return `<button class="${cls}" data-id="${appId}" data-referral="${isOn}" onclick="toggleReferral(this)">${icon} ${label}</button>`;
    }

    const STATUSES = ['applied', 'screening', 'interviewing', 'offer', 'rejected'];

    // older rows may use "interview"; treat as "interviewing"
    function normStatus(s) { return s === 'interview' ? 'interviewing' : (s || 'applied'); }

    function statusSelectHtml(a) {
      const cur = normStatus(a.status);
      const opts = STATUSES.map(s =>
        `<option value="${s}"${s === cur ? ' selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('');
      return `<select class="status-select ${BADGE[cur] || 'badge-applied'}" data-id="${a.id}" onchange="changeStatus(this)">${opts}</select>`;
    }

    async function changeStatus(sel) {
      const appId = sel.dataset.id;
      const newStatus = sel.value;
      const app = allApps.find(a => a.id == appId);
      const prev = app ? normStatus(app.status) : 'applied';
      sel.classList.add('saving');
      try {
        const today = new Date().toISOString().slice(0, 10);
        // moving to a stage also records it permanently, so a later "rejected" keeps the history
        const patch = { status: newStatus, last_activity_date: today };
        if (['screening', 'interviewing', 'offer'].includes(newStatus)) patch.had_interview = true;
        const res = await fetch(`/applications/${appId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        if (app) Object.assign(app, patch);
        updateStats(allApps);
        applyFilter(currentFilter);
      } catch (err) {
        sel.value = prev;
        sel.classList.remove('saving');
        alert('Could not save: ' + err.message);
      }
    }

    function stageChipsHtml(a) {
      const iv = !!a.had_interview;
      return `<div class="stage-chips">
        <button class="chip iv${iv ? ' on' : ''}" data-id="${a.id}" data-field="had_interview" onclick="toggleStage(this)">Interviewed</button>
      </div>`;
    }

    async function toggleStage(btn) {
      const appId = btn.dataset.id;
      const field = btn.dataset.field;
      const app = allApps.find(a => a.id == appId);
      if (!app) return;
      const newVal = !app[field];
      const patch = { [field]: newVal };
      btn.classList.add('saving');
      try {
        const res = await fetch(`/applications/${appId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        Object.assign(app, patch);
        updateStats(allApps);
        applyFilter(currentFilter);
      } catch (err) {
        btn.classList.remove('saving');
        alert('Could not save: ' + err.message);
      }
    }
    window.toggleStage = toggleStage;

    let editingId = null;   // null = adding a new entry, otherwise the id being edited

    function setModalMode(editing) {
      document.getElementById('modalTitle').textContent = editing ? 'Edit application' : 'Add an application';
      document.getElementById('fDateLabel').textContent = editing ? 'Applied date' : 'Date';
      document.getElementById('fLastWrap').style.display = editing ? 'block' : 'none';
    }

    function openEditModal(appId) {
      const a = allApps.find(x => x.id == appId);
      if (!a) return;
      editingId = a.id;
      setModalMode(true);
      document.getElementById('fCompany').value = a.company || '';
      document.getElementById('fRole').value = a.role || '';
      document.getElementById('fStatus').value = normStatus(a.status);
      document.getElementById('fInterview').checked = !!a.had_interview;
      document.getElementById('fDate').value = (a.applied_date || '').slice(0, 10);
      document.getElementById('fLast').value = (a.last_activity_date || '').slice(0, 10);
      document.getElementById('fContact').value = a.contact_name || '';
      document.getElementById('fNotes').value = a.notes || '';
      document.getElementById('addModal').classList.add('open');
      document.getElementById('fCompany').focus();
    }

    function openAddModal() {
      editingId = null;
      setModalMode(false);
      ['fCompany', 'fRole', 'fContact', 'fNotes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fStatus').value = 'screening';
      document.getElementById('fInterview').checked = false;
      document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('addModal').classList.add('open');
      document.getElementById('fCompany').focus();
    }
    function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

    async function saveApp() {
      const company = document.getElementById('fCompany').value.trim();
      if (!company) { alert('Company is required'); return; }
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      try {
        const status = document.getElementById('fStatus').value;
        const role = document.getElementById('fRole').value.trim() || null;
        const contact_name = document.getElementById('fContact').value.trim() || null;
        const notes = document.getElementById('fNotes').value.trim() || null;
        const had_interview = document.getElementById('fInterview').checked
          || ['screening', 'interviewing', 'offer'].includes(status);
        let res;
        if (editingId === null) {
          res = await fetch('/applications', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              company, role, status, had_interview, contact_name, notes,
              date: document.getElementById('fDate').value || null,
            }),
          });
        } else {
          const old = allApps.find(x => x.id == editingId);
          const patch = {
            company, role, status, had_interview, contact_name, notes,
            applied_date: document.getElementById('fDate').value || null,
            last_activity_date: document.getElementById('fLast').value || null,
          };
          // moving to a new stage counts as activity today unless the date was edited by hand
          if (old && normStatus(old.status) !== status && patch.last_activity_date === (old.last_activity_date || null)) {
            patch.last_activity_date = new Date().toISOString().slice(0, 10);
          }
          res = await fetch(`/applications/${editingId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patch),
          });
        }
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
        closeAddModal();
        await loadApps();
      } catch (err) {
        alert('Could not save: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    window.changeStatus = changeStatus;
    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    window.saveApp = saveApp;
    window.openEditModal = openEditModal;

    function renderTable(apps) {
      const tbody = document.getElementById('tableBody');
      if (!apps.length) {
        tbody.innerHTML = `<tr class="state-row"><td colspan="8">${currentFilter !== 'all' ? 'No applications at this stage. Pick another filter to see the rest.' : 'No applications yet. The Gmail sync adds them each morning, or add one yourself.'}</td></tr>`;
        return;
      }
      tbody.innerHTML = apps.map(a => `
        <tr data-id="${a.id}">
          <td>
            <div class="company-name">${escHtml(a.company)}</div>
            ${a.role ? `<div class="role-name">${escHtml(a.role)}</div>` : ''}
          </td>
          <td>${statusSelectHtml(a)}</td>
          <td>${stageChipsHtml(a)}</td>
          <td>${referralBtnHtml(a.id, !!a.referral)}</td>
          <td class="date-cell">${fmtDate(a.applied_date)}</td>
          <td class="date-cell">${fmtDate(a.last_activity_date)}</td>
          <td class="contact-cell">${a.contact_name ? escHtml(a.contact_name) : '—'}</td>
          <td><button class="edit-btn" onclick="openEditModal(${a.id})">Edit</button></td>
        </tr>
      `).join('');
    }

    function updateStats(apps) {
      const active = apps.filter(a => !['rejected', 'offer'].includes(a.status)).length;
      const interviewing = apps.filter(a => ['screening', 'interviewing'].includes(normStatus(a.status))).length;
      const offers = apps.filter(a => a.status === 'offer').length;
      const referrals = apps.filter(a => a.referral).length;
      document.getElementById('statTotal').textContent = apps.length;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statInterviewing').textContent = interviewing;
      document.getElementById('statOffers').textContent = offers;
      document.getElementById('statReferrals').textContent = referrals;
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function applyFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.status === status);
      });
      renderTable(getFiltered());
    }

    function getFiltered() {
      if (currentFilter === 'all') return allApps;
      if (currentFilter === 'referral') return allApps.filter(a => a.referral);
      return allApps.filter(a => normStatus(a.status) === currentFilter);
    }

    function csvCell(v) {
      let s = v === null || v === undefined ? '' : String(v);
      // neutralise spreadsheet formula injection
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function downloadCsv() {
      const rows = getFiltered();
      if (!rows.length) { alert('Nothing to download for this filter.'); return; }
      const cols = [
        ['company', 'Company'], ['role', 'Role'], ['status', 'Status'],
        ['referral', 'Referral'], ['had_interview', 'Interviewed'], ['applied_date', 'Applied'],
        ['last_activity_date', 'Last Activity'], ['contact_name', 'Contact'],
        ['contact_email', 'Contact Email'], ['notes', 'Notes'], ['source', 'Source'],
      ];
      const lines = [cols.map(c => csvCell(c[1])).join(',')];
      rows.forEach(a => {
        lines.push(cols.map(([k]) => {
          if (k === 'status') return csvCell(normStatus(a.status));
          if (k === 'referral' || k === 'had_interview') return csvCell(a[k] ? 'Yes' : 'No');
          return csvCell(a[k]);
        }).join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const stamp = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `applications-${currentFilter}-${stamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
    window.downloadCsv = downloadCsv;

    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (btn) applyFilter(btn.dataset.status);
    });

    async function toggleReferral(btn) {
      const appId = btn.dataset.id;
      const currentVal = btn.dataset.referral === 'true';
      const newVal = !currentVal;

      btn.classList.add('saving');

      try {
        const res = await fetch(`/applications/${appId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ referral: newVal }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        // update local data
        const app = allApps.find(a => a.id == appId);
        if (app) app.referral = newVal;

        // update the button in place
        btn.outerHTML = referralBtnHtml(appId, newVal);
        updateStats(allApps);
      } catch (err) {
        btn.classList.remove('saving');
        alert('Could not save: ' + err.message);
      }
    }

    window.toggleReferral = toggleReferral;

    async function loadApps() {
      try {
        const res = await fetch('/applications');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allApps = await res.json();
        if (allApps.error) throw new Error(allApps.error);

        updateStats(allApps);
        applyFilter(currentFilter);

        // sync badge
        const latest = allApps.reduce((max, a) => (!max || a.updated_at > max ? a.updated_at : max), null);
        const syncEl = document.getElementById('syncBadge');
        if (latest) {
          const d = new Date(latest);
          syncEl.innerHTML = `Synced <span>${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>`;
        } else {
          syncEl.innerHTML = `Synced <span>today</span>`;
        }
      } catch (err) {
        document.getElementById('tableBody').innerHTML =
          `<tr class="state-row"><td colspan="8">Could not load applications: ${escHtml(err.message)}</td></tr>`;
        document.getElementById('statTotal').textContent = '—';
        document.getElementById('statActive').textContent = '—';
        document.getElementById('statInterviewing').textContent = '—';
        document.getElementById('statOffers').textContent = '—';
        document.getElementById('statReferrals').textContent = '—';
      }
    }

    loadApps();
  </script>
</body>
</html>
