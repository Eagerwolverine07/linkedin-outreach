<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --grad:    linear-gradient(135deg, #ffb347 0%, #c471ed 55%, #7b6ef6 100%);
      --bg:      #0f0f13;
      --surface: #18181f;
      --card:    #1e1e28;
      --border:  rgba(255,255,255,.08);
      --text:    #f0f0f5;
      --muted:   #8888a8;
      --radius:  14px;
      --font:    'Plus Jakarta Sans', sans-serif;

      /* status palette */
      --c-sent:        #a0a0c0;
      --c-accepted:    #7b6ef6;
      --c-replied:     #c471ed;
      --c-call:        #ffb347;
      --c-noresp:      #444458;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── nav ── */
    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all .2s;
    }
    .nav-link:hover { color: var(--text); border-color: rgba(255,255,255,.15); background: var(--card); }
    .nav-title {
      font-size: 16px;
      font-weight: 800;
      flex: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-crm {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all .2s;
    }
    .nav-crm:hover { color: var(--text); border-color: rgba(255,255,255,.15); background: var(--card); }

    /* ── page ── */
    .page { padding: 28px 28px 60px; max-width: 1280px; margin: 0 auto; }

    /* ── KPI strip ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .kpi .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi .kpi-val {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .kpi .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .kpi-val.grad {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── grid layout ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .charts-grid .span-2 { grid-column: span 2; }

    @media (max-width: 820px) {
      .charts-grid { grid-template-columns: 1fr; }
      .charts-grid .span-2 { grid-column: span 1; }
    }

    /* ── chart card ── */
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .chart-card h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { width: 100% !important; }

    /* ── funnel bar ── */
    .funnel-bars { display: flex; flex-direction: column; gap: 10px; }
    .f-row { display: flex; align-items: center; gap: 12px; }
    .f-label { font-size: 12px; font-weight: 600; color: var(--text); min-width: 96px; }
    .f-track { flex: 1; height: 28px; background: rgba(255,255,255,.05); border-radius: 6px; overflow: hidden; position: relative; }
    .f-fill  { height: 100%; border-radius: 6px; transition: width .6s ease; }
    .f-count { font-size: 13px; font-weight: 700; min-width: 32px; text-align: right; }
    .f-pct   { font-size: 11px; color: var(--muted); min-width: 40px; text-align: right; }

    /* ── top companies table ── */
    .co-table { width: 100%; border-collapse: collapse; }
    .co-table th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0 0 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .co-table th:not(:first-child) { text-align: right; }
    .co-table td {
      padding: 10px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.04);
      vertical-align: middle;
    }
    .co-table tr:last-child td { border-bottom: none; }
    .co-table td:not(:first-child) { text-align: right; }
    .co-bar-cell { padding-right: 16px; }
    .co-inline-track {
      display: inline-block;
      width: 80px;
      height: 4px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      vertical-align: middle;
    }
    .co-inline-fill {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: var(--grad);
    }

    /* ── empty / loader ── */
    .loading-msg, .empty-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: #7b6ef6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-link">← Pipeline</a>
  <span class="nav-title">Outreach Analytics</span>
  <a href="/crm" class="nav-crm">📋 CRM</a>
</nav>

<div class="page" id="page">
  <div class="loading-msg">
    <div class="spinner"></div><br>Loading analytics…
  </div>
</div>

<script>
  const GRAD_COLORS = {
    sent:        '#a0a0c0',
    accepted:    '#7b6ef6',
    replied:     '#c471ed',
    call_booked: '#ffb347',
    no_response: '#444458',
  };
  const STATUS_LABELS = {
    sent: 'Sent', accepted: 'Accepted', replied: 'Replied',
    call_booked: 'Call Booked', no_response: 'No Response',
  };
  const STATUS_ORDER = ['sent','accepted','replied','call_booked','no_response'];

  // Chart.js global defaults
  Chart.defaults.color = '#8888a8';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  async function init() {
    const [contacts, runs] = await Promise.all([
      fetch('/contacts?limit=1000').then(r => r.json()).catch(() => []),
      fetch('/history?limit=100').then(r => r.json()).catch(() => []),
    ]);

    if (!Array.isArray(contacts) || contacts.length === 0) {
      document.getElementById('page').innerHTML =
        `<div class="empty-msg">No outreach data yet. Run the pipeline to see analytics.</div>`;
      return;
    }

    // ── Derived metrics ──
    const total   = contacts.length;
    const byStatus = {};
    STATUS_ORDER.forEach(s => byStatus[s] = contacts.filter(c => c.status === s).length);

    const acceptRate = total > 0 ? ((byStatus.accepted + byStatus.replied + byStatus.call_booked) / total * 100).toFixed(1) : 0;
    const replyRate  = total > 0 ? ((byStatus.replied  + byStatus.call_booked) / total * 100).toFixed(1) : 0;
    const callRate   = total > 0 ? (byStatus.call_booked / total * 100).toFixed(1) : 0;

    // By company
    const byCompany = {};
    for (const c of contacts) {
      const co = c.company || 'Unknown';
      if (!byCompany[co]) byCompany[co] = { total: 0, ...Object.fromEntries(STATUS_ORDER.map(s => [s, 0])) };
      byCompany[co].total++;
      byCompany[co][c.status] = (byCompany[co][c.status] || 0) + 1;
    }
    const companiesSorted = Object.entries(byCompany).sort((a, b) => b[1].total - a[1].total);

    // Volume over time (by week)
    const weekMap = {};
    for (const c of contacts) {
      const d  = new Date(c.created_at);
      const mon = new Date(d); mon.setDate(d.getDate() - d.getDay() + 1); // Monday
      const key = mon.toISOString().slice(0, 10);
      weekMap[key] = (weekMap[key] || 0) + 1;
    }
    const weeks = Object.keys(weekMap).sort();
    const weekLabels = weeks.map(w => {
      const d = new Date(w + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    });

    // ── Render page ──
    document.getElementById('page').innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Total Contacts</div><div class="kpi-val grad">${total}</div><div class="kpi-sub">${Array.isArray(runs) ? runs.length : 0} run${runs.length !== 1 ? 's' : ''}</div></div>
        <div class="kpi"><div class="kpi-label">Accepted</div><div class="kpi-val" style="color:#7b6ef6">${byStatus.accepted}</div><div class="kpi-sub">${acceptRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">Replied</div><div class="kpi-val" style="color:#c471ed">${byStatus.replied}</div><div class="kpi-sub">${replyRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">Call Booked</div><div class="kpi-val" style="color:#ffb347">${byStatus.call_booked}</div><div class="kpi-sub">${callRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">No Response</div><div class="kpi-val" style="color:#555570">${byStatus.no_response}</div><div class="kpi-sub">${total > 0 ? (byStatus.no_response/total*100).toFixed(1) : 0}%</div></div>
      </div>

      <div class="charts-grid">

        <!-- Volume over time -->
        <div class="chart-card span-2">
          <h3>Outreach Volume by Week</h3>
          <div class="chart-wrap" style="height:220px">
            <canvas id="chart-volume"></canvas>
          </div>
        </div>

        <!-- Funnel -->
        <div class="chart-card">
          <h3>Conversion Funnel</h3>
          <div class="funnel-bars" id="funnel-bars"></div>
        </div>

        <!-- Status donut -->
        <div class="chart-card">
          <h3>Status Breakdown</h3>
          <div class="chart-wrap" style="height:220px">
            <canvas id="chart-donut"></canvas>
          </div>
        </div>

        <!-- Company breakdown -->
        <div class="chart-card span-2">
          <h3>By Company</h3>
          <table class="co-table">
            <thead>
              <tr><th>Company</th><th>Contacts</th><th>Accepted</th><th>Replied</th><th>Call Booked</th><th class="co-bar-cell">Volume</th></tr>
            </thead>
            <tbody id="co-tbody"></tbody>
          </table>
        </div>

        <!-- Status over time (stacked) -->
        <div class="chart-card span-2">
          <h3>Status Mix over Time</h3>
          <div class="chart-wrap" style="height:240px">
            <canvas id="chart-stacked"></canvas>
          </div>
        </div>

      </div>
    `;

    // ── 1. Volume bar chart ──
    new Chart(document.getElementById('chart-volume'), {
      type: 'bar',
      data: {
        labels: weekLabels,
        datasets: [{
          label: 'Contacts',
          data: weeks.map(w => weekMap[w]),
          backgroundColor: 'rgba(123,110,246,0.6)',
          borderColor: '#7b6ef6',
          borderWidth: 1,
          borderRadius: 5,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, beginAtZero: true, ticks: { stepSize: 1 } },
        },
      },
    });

    // ── 2. Funnel bars ──
    const funnelEl = document.getElementById('funnel-bars');
    const funnelStages = [
      { key: 'sent',        label: 'Sent' },
      { key: 'accepted',    label: 'Accepted' },
      { key: 'replied',     label: 'Replied' },
      { key: 'call_booked', label: 'Call Booked' },
    ];
    funnelEl.innerHTML = funnelStages.map(({ key, label }) => {
      const n   = byStatus[key] || 0;
      const pct = total > 0 ? (n / total * 100).toFixed(0) : 0;
      const w   = total > 0 ? Math.max(2, n / total * 100) : 0;
      return `
        <div class="f-row">
          <span class="f-label">${label}</span>
          <div class="f-track">
            <div class="f-fill" style="width:${w}%;background:${GRAD_COLORS[key]}"></div>
          </div>
          <span class="f-count" style="color:${GRAD_COLORS[key]}">${n}</span>
          <span class="f-pct">${pct}%</span>
        </div>`;
    }).join('');

    // ── 3. Donut chart ──
    new Chart(document.getElementById('chart-donut'), {
      type: 'doughnut',
      data: {
        labels: STATUS_ORDER.map(s => STATUS_LABELS[s]),
        datasets: [{
          data: STATUS_ORDER.map(s => byStatus[s]),
          backgroundColor: STATUS_ORDER.map(s => GRAD_COLORS[s]),
          borderWidth: 0,
          hoverOffset: 6,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '68%',
        plugins: {
          legend: {
            position: 'right',
            labels: { boxWidth: 10, padding: 14, font: { size: 12 } },
          },
        },
      },
    });

    // ── 4. Company table ──
    const maxTotal = companiesSorted[0]?.[1].total || 1;
    document.getElementById('co-tbody').innerHTML = companiesSorted.slice(0, 12).map(([co, d]) => {
      const barW = Math.round(d.total / maxTotal * 100);
      return `
        <tr>
          <td style="font-weight:600">${esc(co)}</td>
          <td>${d.total}</td>
          <td style="color:#7b6ef6">${d.accepted || 0}</td>
          <td style="color:#c471ed">${d.replied  || 0}</td>
          <td style="color:#ffb347">${d.call_booked || 0}</td>
          <td class="co-bar-cell">
            <span class="co-inline-track"><span class="co-inline-fill" style="width:${barW}%"></span></span>
          </td>
        </tr>`;
    }).join('');

    // ── 5. Stacked status by week ──
    // Group contacts by week + status
    const weekStatusMap = {};
    for (const c of contacts) {
      const d  = new Date(c.created_at);
      const mon = new Date(d); mon.setDate(d.getDate() - d.getDay() + 1);
      const key = mon.toISOString().slice(0, 10);
      if (!weekStatusMap[key]) weekStatusMap[key] = {};
      weekStatusMap[key][c.status] = (weekStatusMap[key][c.status] || 0) + 1;
    }
    new Chart(document.getElementById('chart-stacked'), {
      type: 'bar',
      data: {
        labels: weekLabels,
        datasets: STATUS_ORDER.map(s => ({
          label: STATUS_LABELS[s],
          data: weeks.map(w => (weekStatusMap[w]?.[s] || 0)),
          backgroundColor: GRAD_COLORS[s],
          borderWidth: 0,
          borderRadius: s === 'no_response' ? 5 : 0,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'top', labels: { boxWidth: 10, padding: 14, font: { size: 12 } } },
        },
        scales: {
          x: { stacked: true, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { stacked: true, grid: { color: 'rgba(255,255,255,0.04)' }, beginAtZero: true, ticks: { stepSize: 1 } },
        },
      },
    });
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
