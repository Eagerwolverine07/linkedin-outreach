<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --grad:    linear-gradient(135deg, #ffb347 0%, #c471ed 55%, #7b6ef6 100%);
      --bg:      #fdf6f0;
      --surface: #ffffff;
      --card:    #ffffff;
      --border:  #ede8f5;
      --text:    #1a1035;
      --muted:   #9090aa;
      --radius:  14px;
      --font:    'Plus Jakarta Sans', sans-serif;
      --c-sent:        #a0a0c0;
      --c-accepted:    #7b6ef6;
      --c-replied:     #c471ed;
      --c-call:        #ffb347;
      --c-noresp:      #c8c8d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(255,179,71,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 110%, rgba(123,110,246,0.15) 0%, transparent 60%);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── nav ── */
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-title {
      font-size: 16px;
      font-weight: 800;
      flex: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); border-color: #c471ed; background: var(--card); }

    /* ── page ── */
    .page { padding: 28px 28px 60px; max-width: 1280px; margin: 0 auto; }

    /* ── skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skel {
      background: linear-gradient(90deg, #ede8f5 25%, #f5f0fc 50%, #ede8f5 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }

    /* skeleton KPI row */
    .skel-kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .skel-kpi-row { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .skel-kpi-row { grid-template-columns: repeat(2, 1fr); } }

    .skel-kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skel-kpi .skel-label { height: 10px; width: 60%; }
    .skel-kpi .skel-val   { height: 34px; width: 45%; }
    .skel-kpi .skel-sub   { height: 10px; width: 50%; }

    /* skeleton chart cards */
    .skel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .skel-grid .span-2 { grid-column: span 2; }
    @media (max-width: 820px) {
      .skel-grid { grid-template-columns: 1fr; }
      .skel-grid .span-2 { grid-column: span 1; }
    }

    .skel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .skel-card .skel-heading { height: 11px; width: 38%; margin-bottom: 20px; }
    .skel-card .skel-chart   { border-radius: 8px; }

    /* ── KPI strip (real) ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .kpi .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi .kpi-val {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .kpi .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .kpi-val.grad {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── chart grid (real) ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .charts-grid .span-2 { grid-column: span 2; }
    @media (max-width: 820px) {
      .charts-grid { grid-template-columns: 1fr; }
      .charts-grid .span-2 { grid-column: span 1; }
    }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .chart-card h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { width: 100% !important; }

    /* ── funnel bars ── */
    .funnel-bars { display: flex; flex-direction: column; gap: 10px; }
    .f-row { display: flex; align-items: center; gap: 12px; }
    .f-label { font-size: 12px; font-weight: 600; color: var(--text); min-width: 96px; }
    .f-track { flex: 1; height: 28px; background: rgba(0,0,0,.05); border-radius: 6px; overflow: hidden; }
    .f-fill  { height: 100%; border-radius: 6px; transition: width .6s ease; }
    .f-count { font-size: 13px; font-weight: 700; min-width: 32px; text-align: right; }
    .f-pct   { font-size: 11px; color: var(--muted); min-width: 40px; text-align: right; }

    /* ── company table ── */
    .co-table { width: 100%; border-collapse: collapse; }
    .co-table th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0 0 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .co-table th:not(:first-child) { text-align: right; }
    .co-table td {
      padding: 10px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .co-table tr:last-child td { border-bottom: none; }
    .co-table td:not(:first-child) { text-align: right; }
    .co-bar-cell { padding-right: 16px; }
    .co-inline-track {
      display: inline-block;
      width: 80px; height: 4px;
      background: rgba(0,0,0,.08);
      border-radius: 3px;
      vertical-align: middle;
    }
    .co-inline-fill { display: block; height: 100%; border-radius: 3px; background: var(--grad); }

    /* ── empty ── */
    .empty-msg {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 15px;
    }
    .empty-msg strong { display: block; font-size: 20px; color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-link">← Pipeline</a>
  <span class="nav-title">Outreach Analytics</span>
  <a href="/crm" class="nav-link">📋 CRM</a>
</nav>

<div class="page" id="page">

  <!-- ── Skeleton ── -->
  <div id="skeleton">
    <div class="skel-kpi-row">
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
    </div>
    <div class="skel-grid">
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:220px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:120px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:240px"></div></div>
    </div>
  </div>

  <!-- ── Real content (hidden until loaded) ── -->
  <div id="content" style="display:none"></div>

</div>

<script>
  const FLAG_COLORS = {
    accepted: '#7b6ef6', replied: '#c471ed',
    warm_intro: '#ffb347', no_response: '#c8c8d8',
  };
  const FLAG_LABELS = { accepted: 'Accepted', replied: 'Replied', warm_intro: 'Warm Intro', no_response: 'No Response' };
  const FLAGS = ['accepted','replied','warm_intro'];

  Chart.defaults.color = '#9090aa';
  Chart.defaults.borderColor = 'rgba(0,0,0,0.06)';
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  async function init() {
    const [contacts, runs] = await Promise.all([
      fetch('/contacts?limit=1000').then(r => r.json()).catch(() => []),
      fetch('/history?limit=100').then(r => r.json()).catch(() => []),
    ]);

    document.getElementById('skeleton').style.display = 'none';

    if (!Array.isArray(contacts) || contacts.length === 0) {
      document.getElementById('content').style.display = 'block';
      document.getElementById('content').innerHTML =
        `<div class="empty-msg"><strong>No data yet</strong>Run the pipeline to start seeing analytics here.</div>`;
      return;
    }

    const total    = contacts.length;
    const byFlag = {};
    FLAGS.forEach(f => byFlag[f] = contacts.filter(c => c[f]).length);
    byFlag.no_response = contacts.filter(c => !c.accepted && !c.replied && !c.warm_intro).length;

    const acceptRate = total > 0 ? (byFlag.accepted / total * 100).toFixed(1) : 0;
    const replyRate  = total > 0 ? (byFlag.replied   / total * 100).toFixed(1) : 0;
    const callRate   = total > 0 ? (byFlag.warm_intro / total * 100).toFixed(1) : 0;

    const byCompany = {};
    for (const c of contacts) {
      const co = c.company || 'Unknown';
      if (!byCompany[co]) byCompany[co] = { total: 0, accepted: 0, replied: 0, warm_intro: 0, no_response: 0 };
      byCompany[co].total++;
      FLAGS.forEach(f => { if (c[f]) byCompany[co][f]++; });
      if (!c.accepted && !c.replied && !c.warm_intro) byCompany[co].no_response++;
    }
    const companiesSorted = Object.entries(byCompany).sort((a, b) => b[1].total - a[1].total);

    const weekMap = {};
    for (const c of contacts) {
      const d = new Date(c.created_at);
      const mon = new Date(d); mon.setDate(d.getDate() - d.getDay() + 1);
      const key = mon.toISOString().slice(0, 10);
      weekMap[key] = (weekMap[key] || 0) + 1;
    }
    const weeks = Object.keys(weekMap).sort();
    const weekLabels = weeks.map(w =>
      new Date(w + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    );

    const runCount = Array.isArray(runs) ? runs.length : 0;

    document.getElementById('content').innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Total Contacts</div><div class="kpi-val grad">${total}</div><div class="kpi-sub">${runCount} run${runCount !== 1 ? 's' : ''}</div></div>
        <div class="kpi"><div class="kpi-label">Accepted</div><div class="kpi-val" style="color:#7b6ef6">${byFlag.accepted}</div><div class="kpi-sub">${acceptRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">Replied</div><div class="kpi-val" style="color:#c471ed">${byFlag.replied}</div><div class="kpi-sub">${replyRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">Warm Intro</div><div class="kpi-val" style="color:#ffb347">${byFlag.warm_intro}</div><div class="kpi-sub">${callRate}% rate</div></div>
        <div class="kpi"><div class="kpi-label">No Response</div><div class="kpi-val" style="color:#555570">${byFlag.no_response}</div><div class="kpi-sub">${total > 0 ? (byFlag.no_response/total*100).toFixed(1) : 0}%</div></div>
      </div>

      <div class="charts-grid">

        <div class="chart-card span-2">
          <h3>Outreach Volume by Week</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="chart-volume"></canvas></div>
        </div>

        <div class="chart-card">
          <h3>Conversion Funnel</h3>
          <div class="funnel-bars" id="funnel-bars"></div>
        </div>

        <div class="chart-card">
          <h3>Status Breakdown</h3>
          <div class="chart-wrap" style="height:220px"><canvas id="chart-donut"></canvas></div>
        </div>

        <div class="chart-card span-2">
          <h3>By Company</h3>
          <table class="co-table">
            <thead><tr>
              <th>Company</th><th>Contacts</th><th>Accepted</th><th>Replied</th><th>Call Booked</th><th class="co-bar-cell">Volume</th>
            </tr></thead>
            <tbody id="co-tbody"></tbody>
          </table>
        </div>

        <div class="chart-card span-2">
          <h3>Status Mix over Time</h3>
          <div class="chart-wrap" style="height:240px"><canvas id="chart-stacked"></canvas></div>
        </div>

      </div>
    `;

    document.getElementById('content').style.display = 'block';

    // 1. Volume bar
    new Chart(document.getElementById('chart-volume'), {
      type: 'bar',
      data: {
        labels: weekLabels,
        datasets: [{
          label: 'Contacts',
          data: weeks.map(w => weekMap[w]),
          backgroundColor: 'rgba(123,110,246,0.55)',
          borderColor: '#7b6ef6',
          borderWidth: 1,
          borderRadius: 5,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: 'rgba(0,0,0,0.06)' } },
          y: { grid: { color: 'rgba(0,0,0,0.06)' }, beginAtZero: true, ticks: { precision: 0 } },
        },
      },
    });

    // 2. Funnel
    const funnelItems = [...FLAGS, 'no_response'];
    document.getElementById('funnel-bars').innerHTML = funnelItems.map(key => {
      const n = byFlag[key] || 0;
      const pct = total > 0 ? (n / total * 100).toFixed(0) : 0;
      const w   = total > 0 ? Math.max(2, n / total * 100) : 0;
      return `
        <div class="f-row">
          <span class="f-label">${FLAG_LABELS[key]}</span>
          <div class="f-track"><div class="f-fill" style="width:${w}%;background:${FLAG_COLORS[key]}"></div></div>
          <span class="f-count" style="color:${FLAG_COLORS[key]}">${n}</span>
          <span class="f-pct">${pct}%</span>
        </div>`;
    }).join('');

    // 3. Donut
    new Chart(document.getElementById('chart-donut'), {
      type: 'doughnut',
      data: {
        labels: funnelItems.map(s => FLAG_LABELS[s]),
        datasets: [{
          data: funnelItems.map(s => byFlag[s]),
          backgroundColor: funnelItems.map(s => FLAG_COLORS[s]),
          borderWidth: 0, hoverOffset: 6,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '68%',
        plugins: { legend: { position: 'right', labels: { boxWidth: 10, padding: 14, font: { size: 12 } } } },
      },
    });

    // 4. Company table
    const maxTotal = companiesSorted[0]?.[1].total || 1;
    document.getElementById('co-tbody').innerHTML = companiesSorted.slice(0, 12).map(([co, d]) => `
      <tr>
        <td style="font-weight:600">${esc(co)}</td>
        <td>${d.total}</td>
        <td style="color:#7b6ef6">${d.accepted || 0}</td>
        <td style="color:#c471ed">${d.replied  || 0}</td>
        <td style="color:#ffb347">${d.warm_intro || 0}</td>
        <td class="co-bar-cell">
          <span class="co-inline-track"><span class="co-inline-fill" style="width:${Math.round(d.total/maxTotal*100)}%"></span></span>
        </td>
      </tr>`).join('');

    // 5. Stacked over time (total contacts sent per week)
    new Chart(document.getElementById('chart-stacked'), {
      type: 'bar',
      data: {
        labels: weekLabels,
        datasets: [{
          label: 'Contacts Sent',
          data: weeks.map(w => weekMap[w] || 0),
          backgroundColor: '#7b6ef6',
          borderWidth: 0,
          borderRadius: 5,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { boxWidth: 10, padding: 14, font: { size: 12 } } } },
        scales: {
          x: { stacked: true, grid: { color: 'rgba(0,0,0,0.06)' } },
          y: { stacked: true, grid: { color: 'rgba(0,0,0,0.06)' }, beginAtZero: true, ticks: { precision: 0 } },
        },
      },
    });
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
