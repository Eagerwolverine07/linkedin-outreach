<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    :root {
      --text: var(--ink);
      --muted: var(--ink-mid);
      --border: var(--rule-strong);
      --card: var(--surface);
      --radius: 6px;

      /* Funnel ramp: the deeper the engagement, the deeper the green.
         No-response stays neutral — it is the absence of news. */
      --f1: #C2D3C9;  /* contacted  */
      --f2: #8CB2A0;  /* accepted   */
      --f3: #4D8A6C;  /* replied    */
      --f4: #1C6B4A;  /* warm intro */
      --f0: #DAD8D2;  /* no response */
    }

    .kpi-sub { margin-top: 3px; }

    /* ── charts ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .span-2 { grid-column: span 2; }

    .chart-card { padding: 22px 24px 24px; }
    .chart-card h2 { font-size: 17px; }
    .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .chart-wrap { position: relative; }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .chart-head h3 { margin-bottom: 0; }

    .week-nav { display: flex; align-items: center; gap: 4px; }
    .week-btn {
      width: 28px; height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--rule-strong);
      background: var(--surface);
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--ink-mid);
      font-size: 13px;
      line-height: 1;
    }
    .week-btn:hover { border-color: var(--ink-mid); color: var(--ink); }
    .week-label {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-mid);
      min-width: 124px;
      text-align: center;
    }

    .series-toggles { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
    .series-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 450;
      color: var(--ink-mid);
      background: var(--surface);
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      cursor: pointer;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .series-btn:hover { border-color: var(--ink-mid); color: var(--ink); }
    .series-btn .swatch {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--swatch, var(--ink-soft));
      flex-shrink: 0;
    }
    .series-btn.on {
      color: var(--ink);
      font-weight: 500;
      border-color: var(--ink);
      background: var(--surface-2);
    }
    .series-btn .ct {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink-soft);
    }

    /* ── funnel ── */
    .funnel-header { margin-bottom: 20px; }
    .funnel-header p { margin-top: 5px; font-size: 13.5px; color: var(--ink-mid); }
    .funnel-bars { display: flex; flex-direction: column; gap: 15px; }

    .f-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .f-label { font-size: 13.5px; font-weight: 500; }
    .f-label .f-n {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--ink-mid);
      font-weight: 400;
      margin-left: 7px;
    }
    .f-pct { font-size: 13px; color: var(--ink-mid); }
    .f-track {
      height: 8px;
      background: var(--surface-2);
      border: 1px solid var(--rule);
      border-radius: 2px;
      overflow: hidden;
    }
    .f-fill { height: 100%; transition: width .4s ease; }
    .f-denom { font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; }

    /* ── donut ── */
    .donut-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    .donut-n {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      color: var(--ink);
    }
    .donut-l { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

    .donut-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      justify-content: center;
      margin-top: 16px;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 13px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    /* ── company table ── */
    .co-table td { padding: 11px 16px; font-size: 13.5px; }
    .co-table thead th { padding: 10px 16px; }
    .co-table .num {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--ink-mid);
    }
    .co-table .num.is-signal { color: var(--signal); }
    .co-table .num.is-zero { color: var(--ink-soft); }
    .co-bar-cell { width: 140px; }
    .co-inline-track {
      display: block;
      height: 6px;
      background: var(--surface-2);
      border: 1px solid var(--rule);
      border-radius: 2px;
      overflow: hidden;
    }
    .co-inline-fill { display: block; height: 100%; background: var(--f2); }

    /* ── skeleton ── */
    .skel-kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 36px;
      background: var(--surface);
    }
    .skel-kpi { padding: 18px 20px; border-right: 1px solid var(--rule); }
    .skel-kpi:last-child { border-right: 0; }
    .skel-val { height: 26px; width: 60%; margin-bottom: 10px; }
    .skel-label { height: 12px; width: 80%; }
    .skel-sub { height: 10px; width: 50%; margin-top: 7px; }
    .skel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .skel-card {
      padding: 22px 24px;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius-lg);
    }
    .skel-heading { height: 15px; width: 180px; margin-bottom: 18px; }
    .skel-chart { height: 180px; }

    @media (max-width: 860px) {
      .charts-grid, .skel-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: span 1; }
      .week-label { min-width: 0; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-capsule">
    <a href="/" class="nav-pill">Home</a>
    <a href="/tracker" class="nav-pill">Applications</a>
    <a href="/outreach" class="nav-pill">Outreach</a>
    <a href="/dashboard" class="nav-pill active">Dashboard</a>
    <a href="/crm" class="nav-pill">Contacts</a>
  </div>
</nav>

<div class="page" id="page">

  <header class="header">
    <h1>Outreach</h1>
    <p>How far your connection requests travel, and which companies answer.</p>
  </header>

  <!-- ── Skeleton ── -->
  <div id="skeleton">
    <div class="skel-kpi-row">
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
    </div>
    <div class="skel-grid">
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:220px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:120px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:240px"></div></div>
    </div>
  </div>

  <!-- ── Real content (hidden until loaded) ── -->
  <div id="content" style="display:none"></div>

</div>

<script>
  // One hue, four depths: the further down the funnel, the deeper the green.
  const FLAG_COLORS = {
    accepted: '#8CB2A0', replied: '#4D8A6C',
    warm_intro: '#1C6B4A', no_response: '#DAD8D2',
  };
  const FLAG_LABELS = { accepted: 'Accepted', replied: 'Replied', warm_intro: 'Warm intro', no_response: 'No response' };
  const FLAGS = ['accepted','replied','warm_intro'];

  Chart.defaults.color = '#656F7B';
  Chart.defaults.borderColor = '#E4E2DB';
  Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif";
  Chart.defaults.font.size = 12;

  async function init() {
    const [contacts, runs] = await Promise.all([
      fetch('/contacts?limit=5000').then(r => r.json()).catch(() => []),
      fetch('/history?limit=100').then(r => r.json()).catch(() => []),
    ]);

    document.getElementById('skeleton').style.display = 'none';

    if (!Array.isArray(contacts) || contacts.length === 0) {
      document.getElementById('content').style.display = 'block';
      document.getElementById('content').innerHTML =
        `<div class="empty-msg"><strong>No data yet</strong>Run the pipeline to start seeing analytics here.</div>`;
      return;
    }

    const total    = contacts.length;
    const byFlag = {};
    FLAGS.forEach(f => byFlag[f] = contacts.filter(c => c[f]).length);
    byFlag.no_response = contacts.filter(c => !c.accepted && !c.replied && !c.warm_intro).length;

    const acceptRate = total > 0             ? (byFlag.accepted   / total            * 100).toFixed(1) : 0;
    const replyRate  = byFlag.accepted > 0   ? (byFlag.replied    / byFlag.accepted  * 100).toFixed(1) : 0;
    const callRate   = byFlag.replied > 0    ? (byFlag.warm_intro / byFlag.replied   * 100).toFixed(1) : 0;

    const byCompany = {};
    for (const c of contacts) {
      const co = c.company || 'Unknown';
      if (!byCompany[co]) byCompany[co] = { total: 0, accepted: 0, replied: 0, warm_intro: 0, no_response: 0 };
      byCompany[co].total++;
      FLAGS.forEach(f => { if (c[f]) byCompany[co][f]++; });
      if (!c.accepted && !c.replied && !c.warm_intro) byCompany[co].no_response++;
    }
    const companiesSorted = Object.entries(byCompany).sort((a, b) => b[1].total - a[1].total);

    // Daily map: { "2026-10-12": count }
    const dayMap = {};
    const flagDayMaps = { accepted: {}, replied: {}, warm_intro: {} };
    for (const c of contacts) {
      const _d = new Date(c.created_at); const key = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
      dayMap[key] = (dayMap[key] || 0) + 1;
      if (c.accepted)   flagDayMaps.accepted[key]   = (flagDayMaps.accepted[key]   || 0) + 1;
      if (c.replied)    flagDayMaps.replied[key]     = (flagDayMaps.replied[key]    || 0) + 1;
      if (c.warm_intro) flagDayMaps.warm_intro[key]  = (flagDayMaps.warm_intro[key] || 0) + 1;
    }
    // All days sorted
    const allDays = Object.keys(dayMap).sort();

    const runCount = Array.isArray(runs) ? runs.length : 0;
    const uniqueCompanies = Object.keys(byCompany).length;

    document.getElementById('content').innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-val">${total}</div><div class="kpi-label">Contacted</div><div class="kpi-sub">${runCount} run${runCount !== 1 ? 's' : ''}</div></div>
        <div class="kpi"><div class="kpi-val">${uniqueCompanies}</div><div class="kpi-label">Companies</div><div class="kpi-sub">${uniqueCompanies > 0 ? (total/uniqueCompanies).toFixed(1) : 0} per company</div></div>
        <div class="kpi ${byFlag.accepted ? '' : 'is-zero'}"><div class="kpi-val">${byFlag.accepted}</div><div class="kpi-label">Accepted</div><div class="kpi-sub">${acceptRate}% of contacted</div></div>
        <div class="kpi ${byFlag.replied ? '' : 'is-zero'}"><div class="kpi-val">${byFlag.replied}</div><div class="kpi-label">Replied</div><div class="kpi-sub">${replyRate}% of accepted</div></div>
        <div class="kpi ${byFlag.warm_intro ? 'is-signal' : 'is-zero'}"><div class="kpi-val">${byFlag.warm_intro}</div><div class="kpi-label">Warm intros</div><div class="kpi-sub">${callRate}% of replies</div></div>
        <div class="kpi is-quiet"><div class="kpi-val">${byFlag.no_response}</div><div class="kpi-label">No response</div><div class="kpi-sub">${total > 0 ? (byFlag.no_response/total*100).toFixed(1) : 0}% of contacted</div></div>
      </div>

      <div class="charts-grid">

        <div class="chart-card span-2">
          <div class="chart-head">
            <h3>Daily volume</h3>
            <div class="week-nav">
              <button class="week-btn" id="vol-prev" onclick="shiftWeek(-1)" aria-label="Previous week">&lsaquo;</button>
              <span class="week-label" id="vol-label"></span>
              <button class="week-btn" id="vol-next" onclick="shiftWeek(1)" aria-label="Next week">&rsaquo;</button>
            </div>
          </div>
          <div class="series-toggles">
            <button class="series-btn" id="vol-tog-accepted" onclick="toggleVolFlag('accepted')" style="--swatch:#8CB2A0"><i class="swatch"></i>Accepted <span class="ct" id="vol-ct-accepted"></span></button>
            <button class="series-btn" id="vol-tog-replied" onclick="toggleVolFlag('replied')" style="--swatch:#4D8A6C"><i class="swatch"></i>Replied <span class="ct" id="vol-ct-replied"></span></button>
            <button class="series-btn" id="vol-tog-warm_intro" onclick="toggleVolFlag('warm_intro')" style="--swatch:#1C6B4A"><i class="swatch"></i>Warm intro <span class="ct" id="vol-ct-warm_intro"></span></button>
          </div>
          <div class="chart-wrap" style="height:220px"><canvas id="chart-volume"></canvas></div>
        </div>

        <div class="chart-card">
          <div class="funnel-header">
            <h2>Where the funnel narrows</h2>
            <p>Each stage as a share of the one before it.</p>
          </div>
          <div class="funnel-bars" id="funnel-bars"></div>
        </div>

        <div class="chart-card">
          <h3>Where contacts stand</h3>
          <div class="chart-wrap" style="height:200px"><canvas id="chart-donut"></canvas></div>
          <div id="donut-center" class="donut-center" style="display:none">
            <div id="donut-center-n" class="donut-n"></div>
            <div id="donut-center-l" class="donut-l"></div>
          </div>
          <div id="donut-legend" class="donut-legend"></div>
        </div>

        <div class="chart-card span-2">
          <h3>By company</h3>
          <table class="co-table">
            <thead><tr>
              <th>Company</th><th>Contacts</th><th>Accepted</th><th>Replied</th><th>Warm intro</th><th class="co-bar-cell">Share of volume</th>
            </tr></thead>
            <tbody id="co-tbody"></tbody>
          </table>
        </div>


      </div>
    `;

    document.getElementById('content').style.display = 'block';

    // 1. Daily line chart with week navigation
    let volChart = null;
    const volActiveFlags = new Set(); // which overlay flags are toggled on

    // Start on the most recent week that actually has outreach data
    function getWeekOffsetForDate(dateStr) {
      const today = new Date();
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
      monday.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + 'T00:00:00');
      const diffMs = target - monday;
      return Math.floor(diffMs / (7 * 24 * 60 * 60 * 1000));
    }
    const lastDataDay = allDays.length > 0 ? allDays[allDays.length - 1] : null;
    let volWeekOffset = lastDataDay ? Math.min(0, getWeekOffsetForDate(lastDataDay)) : 0;

    const VOL_FLAG_CONFIG = {
      accepted:   { label: 'Accepted',    color: '#8CB2A0', bg: 'rgba(140,178,160,0.14)' },
      replied:    { label: 'Replied',     color: '#4D8A6C', bg: 'rgba(77,138,108,0.14)'  },
      warm_intro: { label: 'Warm intro',  color: '#1C6B4A', bg: 'rgba(28,107,74,0.14)'   },
    };

    function getWeekDays(offset) {
      // Monday-based week containing today + offset weeks
      const today = new Date();
      const dow = today.getDay(); // 0=Sun
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
      monday.setHours(0, 0, 0, 0);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
      }
      return days;
    }

    function renderVolChart() {
      const _td = new Date(); const todayStr = `${_td.getFullYear()}-${String(_td.getMonth()+1).padStart(2,'0')}-${String(_td.getDate()).padStart(2,'0')}`;
      const days = getWeekDays(volWeekOffset);
      const labels = days.map(d => {
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      });
      // null for future dates so the line ends at today rather than trailing as zeros
      const isFuture = d => volWeekOffset >= 0 && d > todayStr;
      const data = days.map(d => isFuture(d) ? null : (dayMap[d] || 0));

      // Week label
      const start = new Date(days[0] + 'T00:00:00');
      const end   = new Date(days[6] + 'T00:00:00');
      const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      document.getElementById('vol-label').textContent = `${fmt(start)} – ${fmt(end)}`;

      // Disable next if already at current week
      document.getElementById('vol-next').disabled = volWeekOffset >= 0;
      document.getElementById('vol-next').style.opacity = volWeekOffset >= 0 ? '0.35' : '1';

      // Build datasets: base contacts + any active flag overlays
      const datasets = [{
        label: 'Contacts',
        data,
        borderColor: '#9AA3AE',
        backgroundColor: 'rgba(154,163,174,0.08)',
        borderWidth: 2,
        pointBackgroundColor: '#9AA3AE',
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0.35,
        fill: true,
        borderDash: volActiveFlags.size > 0 ? [4,3] : [],
      }];

      for (const flag of ['accepted', 'replied', 'warm_intro']) {
        if (!volActiveFlags.has(flag)) continue;
        const cfg = VOL_FLAG_CONFIG[flag];
        const flagData = days.map(d => isFuture(d) ? null : (flagDayMaps[flag][d] || 0));
        datasets.push({
          label: cfg.label,
          data: flagData,
          borderColor: cfg.color,
          backgroundColor: cfg.bg,
          borderWidth: 2.5,
          pointBackgroundColor: cfg.color,
          pointRadius: 5,
          pointHoverRadius: 7,
          tension: 0.35,
          fill: false,
        });
      }

      const showLegend = volActiveFlags.size > 0;

      if (volChart) volChart.destroy();
      volChart = new Chart(document.getElementById('chart-volume'), {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: {
              display: showLegend,
              position: 'top',
              align: 'end',
              labels: { boxWidth: 12, font: { size: 11, weight: '600' }, padding: 12 }
            }
          },
          scales: {
            x: { grid: { color: 'rgba(0,0,0,0.06)' } },
            y: { grid: { color: 'rgba(0,0,0,0.06)' }, beginAtZero: true, ticks: { precision: 0 } },
          },
        },
      });
    }

    window.shiftWeek = function(dir) {
      if (dir === 1 && volWeekOffset >= 0) return;
      volWeekOffset += dir;
      renderVolChart();
    };

    window.toggleVolFlag = function(flag) {
      if (volActiveFlags.has(flag)) {
        volActiveFlags.delete(flag);
      } else {
        volActiveFlags.add(flag);
      }
      // Update button appearance
      const cfg = VOL_FLAG_CONFIG[flag];
      const btn = document.getElementById(`vol-tog-${flag}`);
      if (btn) {
        const active = volActiveFlags.has(flag);
        btn.classList.toggle('on', active);
      }
      renderVolChart();
    };

    // Populate flag counts on the toggle buttons
    for (const flag of ['accepted', 'replied', 'warm_intro']) {
      const total_flag = Object.values(flagDayMaps[flag]).reduce((s, v) => s + v, 0);
      const el = document.getElementById(`vol-ct-${flag}`);
      if (el && total_flag > 0) el.textContent = `(${total_flag})`;
    }

    renderVolChart();

    // 2. Funnel — 4 stages, each with correct denominator
    const funnelStages = [
      { label: 'Contacted',  n: total,              denom: total,           denomLabel: 'everyone reached',   color: '#C2D3C9' },
      { label: 'Accepted',   n: byFlag.accepted,    denom: total,           denomLabel: 'of those contacted', color: '#8CB2A0' },
      { label: 'Replied',    n: byFlag.replied,     denom: byFlag.accepted, denomLabel: 'of those accepted',  color: '#4D8A6C' },
      { label: 'Warm intro', n: byFlag.warm_intro,  denom: byFlag.replied,  denomLabel: 'of those who replied', color: '#1C6B4A' },
    ];
    document.getElementById('funnel-bars').innerHTML = funnelStages.map(({ label, n, denom, denomLabel, color }) => {
      const pctNum = denom > 0 ? (n / denom * 100) : 0;
      const pctStr = denom > 0 ? (pctNum % 1 === 0 ? pctNum.toFixed(0) : pctNum.toFixed(1)) + '%' : '0%';
      const w = denom > 0 ? Math.max(1, pctNum) : 0;
      return `
        <div class="f-row">
          <div class="f-top">
            <span class="f-label">${label}<span class="f-n">${n}</span></span>
            <span class="f-pct">${pctStr}</span>
          </div>
          <div class="f-track"><div class="f-fill" style="width:${w}%;background:${color}"></div></div>
          <div class="f-denom">${denomLabel}</div>
        </div>`;
    }).join('');

    // 3. Donut — four states a contact can be in, each one exclusive of the
    //    others, so the slices add up to the total in the middle.
    const DONUT = [
      { key: 'no_response', label: 'No response',    n: byFlag.no_response,                  color: FLAG_COLORS.no_response },
      { key: 'accepted',    label: 'Accepted only',  n: byFlag.accepted - byFlag.replied,    color: FLAG_COLORS.accepted },
      { key: 'replied',     label: 'Replied',        n: byFlag.replied - byFlag.warm_intro,  color: FLAG_COLORS.replied },
      { key: 'warm_intro',  label: 'Warm intro',     n: byFlag.warm_intro,                   color: FLAG_COLORS.warm_intro },
    ].filter(d => d.n > 0);
    const donutCard = document.getElementById('chart-donut').closest('.chart-card');
    donutCard.style.position = 'relative';
    const donutCenter  = document.getElementById('donut-center');
    const donutCenterN = document.getElementById('donut-center-n');
    const donutCenterL = document.getElementById('donut-center-l');

    // center-text plugin — total in center
    const centerTextPlugin = {
      id: 'centerText',
      afterDraw(chart) {
        const { ctx, chartArea: { top, bottom, left, right } } = chart;
        const cx = (left + right) / 2, cy = (top + bottom) / 2;
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = "500 24px 'IBM Plex Mono', monospace";
        ctx.fillStyle = '#15202E';
        ctx.fillText(total, cx, cy - 9);
        ctx.font = "400 12px 'IBM Plex Sans', sans-serif";
        ctx.fillStyle = '#656F7B';
        ctx.fillText('contacted', cx, cy + 14);
        ctx.restore();
      }
    };

    // percentage labels drawn on slices
    const pctLabelPlugin = {
      id: 'pctLabels',
      afterDatasetDraw(chart) {
        const { ctx, data } = chart;
        const dataset = chart.getDatasetMeta(0);
        dataset.data.forEach((arc, i) => {
          const val = data.datasets[0].data[i];
          const pct = total > 0 ? (val / total * 100) : 0;
          if (pct < 4) return; // skip tiny slices
          const angle = (arc.startAngle + arc.endAngle) / 2;
          const r = (arc.innerRadius + arc.outerRadius) / 2;
          const x = arc.x + Math.cos(angle) * r;
          const y = arc.y + Math.sin(angle) * r;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = "500 12px 'IBM Plex Mono', monospace";
          ctx.fillStyle = DONUT[i].key === 'warm_intro' || DONUT[i].key === 'replied' ? '#FFFFFF' : '#15202E';
          ctx.fillText(pct.toFixed(1) + '%', x, y);
          ctx.restore();
        });
      }
    };

    new Chart(document.getElementById('chart-donut'), {
      type: 'doughnut',
      data: {
        labels: DONUT.map(d => d.label),
        datasets: [{
          data: DONUT.map(d => d.n),
          backgroundColor: DONUT.map(d => d.color),
          borderWidth: 2,
          borderColor: '#FFFFFF',
          hoverOffset: 8,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '50%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label(ctx) {
                const n = ctx.parsed;
                const pct = total > 0 ? (n / total * 100).toFixed(1) : 0;
                return ` ${DONUT[ctx.dataIndex].label}: ${n} (${pct}%)`;
              }
            }
          }
        },
      },
      plugins: [centerTextPlugin, pctLabelPlugin],
    });

    // Legend — just colour + label, larger text
    document.getElementById('donut-legend').innerHTML = DONUT.map(d => `
      <div class="legend-item">
        <span class="legend-swatch" style="background:${d.color}"></span>
        <span>${d.label}</span>
      </div>`).join('');

    // 4. Company table
    const maxTotal = companiesSorted[0]?.[1].total || 1;
    document.getElementById('co-tbody').innerHTML = companiesSorted.slice(0, 12).map(([co, d]) => `
      <tr>
        <td style="font-weight:500">${esc(co)}</td>
        <td class="num">${d.total}</td>
        <td class="num ${d.accepted ? '' : 'is-zero'}">${d.accepted || 0}</td>
        <td class="num ${d.replied ? '' : 'is-zero'}">${d.replied  || 0}</td>
        <td class="num ${d.warm_intro ? 'is-signal' : 'is-zero'}">${d.warm_intro || 0}</td>
        <td class="co-bar-cell">
          <span class="co-inline-track"><span class="co-inline-fill" style="width:${Math.round(d.total/maxTotal*100)}%"></span></span>
        </td>
      </tr>`).join('');

  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
