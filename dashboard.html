<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outreach Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --grad:    linear-gradient(135deg, #ffb347 0%, #c471ed 55%, #7b6ef6 100%);
      --bg:      #fdf6f0;
      --surface: #ffffff;
      --card:    #ffffff;
      --border:  #ede8f5;
      --text:    #1a1035;
      --muted:   #9090aa;
      --radius:  14px;
      --font:    'Plus Jakarta Sans', sans-serif;
      --c-sent:        #a0a0c0;
      --c-accepted:    #7b6ef6;
      --c-replied:     #c471ed;
      --c-call:        #ffb347;
      --c-noresp:      #c8c8d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(255,179,71,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 110%, rgba(123,110,246,0.15) 0%, transparent 60%);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── nav ── */
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-title {
      font-size: 16px;
      font-weight: 800;
      flex: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text); border-color: #c471ed; background: var(--card); }
    .nav-link.active {
      background: var(--grad);
      border-color: transparent;
      color: #fff;
      -webkit-text-fill-color: #fff;
    }

    /* ── page ── */
    .page { padding: 28px 28px 60px; max-width: 1280px; margin: 0 auto; }

    /* ── skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skel {
      background: linear-gradient(90deg, #ede8f5 25%, #f5f0fc 50%, #ede8f5 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }

    /* skeleton KPI row */
    .skel-kpi-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .skel-kpi-row { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 560px) { .skel-kpi-row { grid-template-columns: repeat(2, 1fr); } }

    .skel-kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .skel-kpi .skel-label { height: 10px; width: 60%; }
    .skel-kpi .skel-val   { height: 34px; width: 45%; }
    .skel-kpi .skel-sub   { height: 10px; width: 50%; }

    /* skeleton chart cards */
    .skel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .skel-grid .span-2 { grid-column: span 2; }
    @media (max-width: 820px) {
      .skel-grid { grid-template-columns: 1fr; }
      .skel-grid .span-2 { grid-column: span 1; }
    }

    .skel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .skel-card .skel-heading { height: 11px; width: 38%; margin-bottom: 20px; }
    .skel-card .skel-chart   { border-radius: 8px; }

    /* ── KPI strip (real) ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .kpi .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi .kpi-val {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .kpi .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .kpi-val.grad {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── chart grid (real) ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .charts-grid .span-2 { grid-column: span 2; }
    @media (max-width: 820px) {
      .charts-grid { grid-template-columns: 1fr; }
      .charts-grid .span-2 { grid-column: span 1; }
    }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
    }
    .chart-card h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { width: 100% !important; }

    /* ── funnel bars ── */
    .funnel-header { margin-bottom: 22px; }
    .funnel-header h2 { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .funnel-header p  { font-size: 13px; color: var(--muted); }
    .funnel-bars { display: flex; flex-direction: column; gap: 14px; }
    .f-row { display: flex; flex-direction: column; gap: 5px; }
    .f-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .f-track {
      position: relative;
      width: 100%; height: 44px;
      background: rgba(0,0,0,.06);
      border-radius: 10px;
      overflow: hidden;
    }
    .f-fill {
      position: absolute; inset: 0 auto 0 0;
      border-radius: 10px;
      transition: width .7s cubic-bezier(.4,0,.2,1);
      min-width: 60px;
    }
    .f-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      pointer-events: none;
    }
    .f-count { font-size: 18px; font-weight: 800; }
    .f-pct   { font-size: 12px; font-weight: 600; white-space: nowrap; }

    /* ── company table ── */
    .co-table { width: 100%; border-collapse: collapse; }
    .co-table th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      padding: 0 0 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .co-table th:not(:first-child) { text-align: right; }
    .co-table td {
      padding: 10px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .co-table tr:last-child td { border-bottom: none; }
    .co-table td:not(:first-child) { text-align: right; }
    .co-bar-cell { padding-right: 16px; }
    .co-inline-track {
      display: inline-block;
      width: 80px; height: 4px;
      background: rgba(0,0,0,.08);
      border-radius: 3px;
      vertical-align: middle;
    }
    .co-inline-fill { display: block; height: 100%; border-radius: 3px; background: var(--grad); }

    /* ── empty ── */
    .empty-msg {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 15px;
    }
    .empty-msg strong { display: block; font-size: 20px; color: var(--text); margin-bottom: 8px; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-link">🚀 Pipeline</a>
  <span class="nav-title grad-text">Outreach Analytics</span>
  <a href="/dashboard" class="nav-link active">📊 Dashboard</a>
  <a href="/crm" class="nav-link">📋 CRM</a>
</nav>

<div class="page" id="page">

  <!-- ── Skeleton ── -->
  <div id="skeleton">
    <div class="skel-kpi-row">
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
      <div class="skel-kpi"><div class="skel skel-label"></div><div class="skel skel-val"></div><div class="skel skel-sub"></div></div>
    </div>
    <div class="skel-grid">
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:220px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:200px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:120px"></div></div>
      <div class="skel-card span-2"><div class="skel skel-heading"></div><div class="skel skel-chart" style="height:240px"></div></div>
    </div>
  </div>

  <!-- ── Real content (hidden until loaded) ── -->
  <div id="content" style="display:none"></div>

</div>

<script>
  const FLAG_COLORS = {
    accepted: '#7b6ef6', replied: '#c471ed',
    warm_intro: '#ffb347', no_response: '#c8c8d8',
  };
  const FLAG_LABELS = { accepted: 'Accepted', replied: 'Replied', warm_intro: 'Warm Intro', no_response: 'No Response' };
  const FLAGS = ['accepted','replied','warm_intro'];

  Chart.defaults.color = '#9090aa';
  Chart.defaults.borderColor = 'rgba(0,0,0,0.06)';
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  async function init() {
    const [contacts, runs] = await Promise.all([
      fetch('/contacts?limit=1000').then(r => r.json()).catch(() => []),
      fetch('/history?limit=100').then(r => r.json()).catch(() => []),
    ]);

    document.getElementById('skeleton').style.display = 'none';

    if (!Array.isArray(contacts) || contacts.length === 0) {
      document.getElementById('content').style.display = 'block';
      document.getElementById('content').innerHTML =
        `<div class="empty-msg"><strong>No data yet</strong>Run the pipeline to start seeing analytics here.</div>`;
      return;
    }

    const total    = contacts.length;
    const byFlag = {};
    FLAGS.forEach(f => byFlag[f] = contacts.filter(c => c[f]).length);
    byFlag.no_response = contacts.filter(c => !c.accepted && !c.replied && !c.warm_intro).length;

    const acceptRate = total > 0             ? (byFlag.accepted   / total            * 100).toFixed(1) : 0;
    const replyRate  = byFlag.accepted > 0   ? (byFlag.replied    / byFlag.accepted  * 100).toFixed(1) : 0;
    const callRate   = byFlag.accepted > 0   ? (byFlag.warm_intro / byFlag.accepted  * 100).toFixed(1) : 0;

    const byCompany = {};
    for (const c of contacts) {
      const co = c.company || 'Unknown';
      if (!byCompany[co]) byCompany[co] = { total: 0, accepted: 0, replied: 0, warm_intro: 0, no_response: 0 };
      byCompany[co].total++;
      FLAGS.forEach(f => { if (c[f]) byCompany[co][f]++; });
      if (!c.accepted && !c.replied && !c.warm_intro) byCompany[co].no_response++;
    }
    const companiesSorted = Object.entries(byCompany).sort((a, b) => b[1].total - a[1].total);

    // Daily map: { "2026-10-12": count }
    const dayMap = {};
    for (const c of contacts) {
      const key = new Date(c.created_at).toISOString().slice(0, 10);
      dayMap[key] = (dayMap[key] || 0) + 1;
    }
    // All days sorted
    const allDays = Object.keys(dayMap).sort();

    const runCount = Array.isArray(runs) ? runs.length : 0;

    document.getElementById('content').innerHTML = `
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-label">Total Contacts</div><div class="kpi-val grad">${total}</div><div class="kpi-sub">${runCount} run${runCount !== 1 ? 's' : ''}</div></div>
        <div class="kpi"><div class="kpi-label">Accepted</div><div class="kpi-val" style="color:#7b6ef6">${byFlag.accepted}</div><div class="kpi-sub">${acceptRate}% of sent</div></div>
        <div class="kpi"><div class="kpi-label">Replied</div><div class="kpi-val" style="color:#c471ed">${byFlag.replied}</div><div class="kpi-sub">${replyRate}% of accepted</div></div>
        <div class="kpi"><div class="kpi-label">Warm Intro</div><div class="kpi-val" style="color:#ffb347">${byFlag.warm_intro}</div><div class="kpi-sub">${callRate}% of accepted</div></div>
        <div class="kpi"><div class="kpi-label">No Response</div><div class="kpi-val" style="color:#555570">${byFlag.no_response}</div><div class="kpi-sub">${total > 0 ? (byFlag.no_response/total*100).toFixed(1) : 0}%</div></div>
      </div>

      <div class="charts-grid">

        <div class="chart-card span-2">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
            <h3 style="margin-bottom:0">Daily Outreach Volume</h3>
            <div style="display:flex;align-items:center;gap:8px">
              <button id="vol-prev" onclick="shiftWeek(-1)" style="border:1.5px solid var(--border);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)">←</button>
              <span id="vol-label" style="font-size:12px;font-weight:600;color:var(--muted);min-width:140px;text-align:center"></span>
              <button id="vol-next" onclick="shiftWeek(1)" style="border:1.5px solid var(--border);background:var(--card);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)">→</button>
            </div>
          </div>
          <div class="chart-wrap" style="height:220px"><canvas id="chart-volume"></canvas></div>
        </div>

        <div class="chart-card">
          <div class="funnel-header">
            <h2>From connection to opportunity</h2>
            <p>Where your outreach turns into meaningful conversations.</p>
          </div>
          <div class="funnel-bars" id="funnel-bars"></div>
        </div>

        <div class="chart-card">
          <h3>Status Breakdown</h3>
          <div style="position:relative;height:200px"><canvas id="chart-donut"></canvas></div>
          <div id="donut-center" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:none">
            <div id="donut-center-n" style="font-size:26px;font-weight:800;line-height:1"></div>
            <div id="donut-center-l" style="font-size:11px;color:var(--muted);font-weight:600;margin-top:3px"></div>
          </div>
          <div id="donut-legend" style="display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;justify-content:center"></div>
        </div>

        <div class="chart-card span-2">
          <h3>By Company</h3>
          <table class="co-table">
            <thead><tr>
              <th>Company</th><th>Contacts</th><th>Accepted</th><th>Replied</th><th>Call Booked</th><th class="co-bar-cell">Volume</th>
            </tr></thead>
            <tbody id="co-tbody"></tbody>
          </table>
        </div>


      </div>
    `;

    document.getElementById('content').style.display = 'block';

    // 1. Daily line chart with week navigation
    let volChart = null;
    let volWeekOffset = 0; // 0 = current week, -1 = last week, etc.

    function getWeekDays(offset) {
      // Monday-based week containing today + offset weeks
      const today = new Date();
      const dow = today.getDay(); // 0=Sun
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
      monday.setHours(0, 0, 0, 0);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d.toISOString().slice(0, 10));
      }
      return days;
    }

    function renderVolChart() {
      const days = getWeekDays(volWeekOffset);
      const labels = days.map(d => {
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      });
      const data = days.map(d => dayMap[d] || 0);

      // Week label
      const start = new Date(days[0] + 'T00:00:00');
      const end   = new Date(days[6] + 'T00:00:00');
      const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      document.getElementById('vol-label').textContent = `${fmt(start)} – ${fmt(end)}`;

      // Disable next if already at current week
      document.getElementById('vol-next').disabled = volWeekOffset >= 0;
      document.getElementById('vol-next').style.opacity = volWeekOffset >= 0 ? '0.35' : '1';

      if (volChart) volChart.destroy();
      volChart = new Chart(document.getElementById('chart-volume'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Contacts',
            data,
            borderColor: '#7b6ef6',
            backgroundColor: 'rgba(123,110,246,0.10)',
            borderWidth: 2.5,
            pointBackgroundColor: '#7b6ef6',
            pointRadius: 5,
            pointHoverRadius: 7,
            tension: 0.35,
            fill: true,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(0,0,0,0.06)' } },
            y: { grid: { color: 'rgba(0,0,0,0.06)' }, beginAtZero: true, ticks: { precision: 0 } },
          },
        },
      });
    }

    window.shiftWeek = function(dir) {
      if (dir === 1 && volWeekOffset >= 0) return;
      volWeekOffset += dir;
      renderVolChart();
    };

    renderVolChart();

    // 2. Funnel — 4 stages, each with correct denominator
    const funnelStages = [
      { label: 'Contacted',  n: total,              denom: total,              denomLabel: '100% of contacts', color: '#a0a0c0' },
      { label: 'Accepted',   n: byFlag.accepted,    denom: total,              denomLabel: '% of contacts',    color: '#7b6ef6' },
      { label: 'Replied',    n: byFlag.replied,     denom: byFlag.accepted,    denomLabel: '% of accepted',    color: '#c471ed' },
      { label: 'Warm intro', n: byFlag.warm_intro,  denom: byFlag.replied,     denomLabel: '% of replies',     color: '#ffb347' },
    ];
    document.getElementById('funnel-bars').innerHTML = funnelStages.map(({ label, n, denom, denomLabel, color }) => {
      const pctNum = denom > 0 ? (n / denom * 100) : 0;
      const pctStr = denom > 0 ? (pctNum % 1 === 0 ? pctNum.toFixed(0) : pctNum.toFixed(1)) + '%' : '0%';
      const w = denom > 0 ? Math.max(1, pctNum) : 0;
      return `
        <div class="f-row">
          <span class="f-label">${label}</span>
          <div class="f-track">
            <div class="f-fill" style="width:${w}%;background:${color}"></div>
            <div class="f-inner">
              <span class="f-count">${n}</span>
              <span class="f-pct">${pctStr} ${denomLabel}</span>
            </div>
          </div>
        </div>`;
    }).join('');

    // 3. Donut — rich version with center stat + custom legend
    const funnelItems = [...FLAGS, 'no_response'];
    const donutCard = document.getElementById('chart-donut').closest('.chart-card');
    donutCard.style.position = 'relative';
    const donutCenter  = document.getElementById('donut-center');
    const donutCenterN = document.getElementById('donut-center-n');
    const donutCenterL = document.getElementById('donut-center-l');

    // center-text plugin
    const centerTextPlugin = {
      id: 'centerText',
      afterDraw(chart) {
        const { ctx, chartArea: { top, bottom, left, right } } = chart;
        const cx = (left + right) / 2, cy = (top + bottom) / 2;
        ctx.save();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '800 26px Plus Jakarta Sans, sans-serif';
        ctx.fillStyle = '#1a1035';
        ctx.fillText(total, cx, cy - 9);
        ctx.font = '600 11px Plus Jakarta Sans, sans-serif';
        ctx.fillStyle = '#9090aa';
        ctx.fillText('Total', cx, cy + 13);
        ctx.restore();
      }
    };

    new Chart(document.getElementById('chart-donut'), {
      type: 'doughnut',
      data: {
        labels: funnelItems.map(s => FLAG_LABELS[s]),
        datasets: [{
          data: funnelItems.map(s => byFlag[s]),
          backgroundColor: funnelItems.map(s => FLAG_COLORS[s]),
          borderWidth: 2,
          borderColor: '#fdf6f0',
          hoverOffset: 8,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label(ctx) {
                const n = ctx.parsed;
                const pct = total > 0 ? (n / total * 100).toFixed(1) : 0;
                return ` ${n} contacts (${pct}%)`;
              }
            }
          }
        },
      },
      plugins: [centerTextPlugin],
    });

    // Custom legend
    document.getElementById('donut-legend').innerHTML = funnelItems.map(key => {
      const n = byFlag[key] || 0;
      const pct = total > 0 ? (n / total * 100).toFixed(0) : 0;
      return `<div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <span style="width:10px;height:10px;border-radius:3px;background:${FLAG_COLORS[key]};flex-shrink:0"></span>
        <span style="color:var(--muted)">${FLAG_LABELS[key]}</span>
        <span style="font-weight:700;color:${FLAG_COLORS[key]}">${n}</span>
        <span style="color:var(--muted)">(${pct}%)</span>
      </div>`;
    }).join('');

    // 4. Company table
    const maxTotal = companiesSorted[0]?.[1].total || 1;
    document.getElementById('co-tbody').innerHTML = companiesSorted.slice(0, 12).map(([co, d]) => `
      <tr>
        <td style="font-weight:600">${esc(co)}</td>
        <td>${d.total}</td>
        <td style="color:#7b6ef6">${d.accepted || 0}</td>
        <td style="color:#c471ed">${d.replied  || 0}</td>
        <td style="color:#ffb347">${d.warm_intro || 0}</td>
        <td class="co-bar-cell">
          <span class="co-inline-track"><span class="co-inline-fill" style="width:${Math.round(d.total/maxTotal*100)}%"></span></span>
        </td>
      </tr>`).join('');

  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
